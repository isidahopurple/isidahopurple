unverified:
  - "The title combines the pamphlet heading ('Proposition One: Reproductive Freedom & Privacy Act') with the Attorney General's official short ballot title. Check the exact wording on the printed ballot."
  - "idgop.org blocked automated reading, so the Idaho Republican Party's opposition comes from Ballotpedia's listing and was not read at the source. The Deseret News (LDS Church), Idaho Freedom Foundation and Idaho Democratic Party pages were read and confirm each group's stance."
  - "ACLU of Idaho and Planned Parenthood Alliance Advocates are listed as supporters by Ballotpedia. Their pages load, but their stances were not read in full."
  - "Passing threshold: Ballotpedia says initiated statutes need a simple majority. No SoS page states it outright."
  - "Order (3) follows the voter pamphlet. Printed ballot order is not confirmed."
