title: "Advisory Question - House Bill 932: Which of the following guns should be designated as the state gun of Idaho?"
short_name: "State gun question"
order: 4
kind: advisory
summary: >-
  This is a non-binding question. It asks voters to pick one of six guns to be
  Idaho's official state gun. The result only advises the Legislature, which
  would have to pass a separate law in a future session to name a state gun.
yes_means: >-
  This question has no Yes or No. You pick one of six choices: (a) Winchester
  Model 1894 (.30-30); (b) Winchester Model 1873 "Gun that Won the West"
  (.44-40); (c) 1873 Colt Single Action Army Revolver "Peacemaker" (.45 Colt);
  (d) M1 Garand rifle (.30-06); (e) Colt M1911 .45 automatic Colt pistol (.45
  ACP); or (f) Remington Model 700 bolt-action rifle (.30-06).
no_means: >-
  There is no No option. You can skip this question and the rest of your ballot
  still counts. Whatever the result, nothing becomes law unless the Legislature
  acts later.
passes_with: >-
  Nothing passes or fails. The Secretary of State counts the votes and the
  results "guide the Legislature" (House Bill 932). The result is not binding.
supporters: []
opponents: []
