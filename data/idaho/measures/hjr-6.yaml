unverified:
  - "No organized campaign for or against HJR 6 was found. Ballotpedia reports $0 raised on either side as of Aug 10, 2026. Supporters and opponents are left empty rather than listing individual lawmakers. In 2025 it passed the House 59-8 and the Senate 30-5."
  - "Passing threshold: the constitution says 'a majority of the electors.' Ballotpedia and past practice treat this as a simple majority of votes cast on the question. No SoS page states it outright."
  - "Order (2) follows the voter pamphlet. Printed ballot order is not confirmed."
