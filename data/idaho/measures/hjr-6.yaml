title: "Idaho HJR 6, the English as Official State Language Amendment"
short_name: "HJR 6"
order: 2
kind: constitutional-amendment
summary: >-
  HJR 6 would add a section to the Idaho Constitution making English the
  official state language. Public meetings, documents and public school
  instruction would be in English, except where federal law requires another
  language. English is already Idaho's official language in state law, but not
  in the constitution.
yes_means: >-
  English becomes the official state language in the Idaho Constitution, and
  government proceedings, documents and public instruction must be in English
  unless federal law requires otherwise.
no_means: >-
  No change to the Idaho Constitution. English stays the official state
  language in state law (Idaho Code 73-121) only.
passes_with: >-
  A majority of the votes cast on the question. (The Idaho Constitution,
  Article XX, Section 1, says a "majority of the electors" must ratify an
  amendment.)
supporters: []
opponents: []
