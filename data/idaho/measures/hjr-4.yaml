unverified:
  - "The title is the name the Secretary of State uses on VoteIdaho.gov. The question printed on the ballot is the 'Shall Section 26, Article III...' wording in the voter pamphlet. Check the printed ballot."
  - "Passing threshold: the constitution says 'a majority of the electors.' Ballotpedia and past practice treat this as a simple majority of votes cast on the question. No SoS page states it outright."
  - "Order (1) follows the voter pamphlet. Printed ballot order is not confirmed."
  - "Ballotpedia shows no registered campaign committee for or against HJR 4 as of Aug 10, 2026."
  - "The pamphlet date is the date we accessed it, not a publication date."
