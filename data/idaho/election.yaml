  verified: true

ballot_collection_warning:
  label:
    en: "Don't carry other people's ballots"
    es: "No lleve las boletas de otras personas"
  value:
    en: "In Idaho it is a crime to collect or deliver someone else's ballot, voted or blank, unless the law allows it."
    es: "En Idaho es un delito recoger o entregar la boleta de otra persona, votada o en blanco, a menos que la ley lo permita."
  note:
    en: "The law allows election officials, mail carriers and delivery companies. It also allows someone the voter pays themselves, a relative, a member of the voter's household, and a caregiver (unless the voter is in memory or cognitive care). A relative, household member or caregiver can carry at most 6 voted and 6 blank ballots per election. Candidates, and anyone who works or volunteers for a party, candidate or campaign group, can't use the relative, household or caregiver exceptions. Breaking this law is a misdemeanor. It is a felony if someone other than the voter paid you, or if it involves 10 or more ballots. This site will never collect or deliver ballots."
    es: "La ley lo permite a los funcionarios electorales, a los carteros y a las compañías de entrega. También lo permite a alguien a quien el mismo votante le paga, a un familiar, a alguien que vive en la misma casa que el votante y a un cuidador (a menos que el votante esté en un centro de cuidado de la memoria o cognitivo). Un familiar, alguien de la misma casa o un cuidador puede llevar como máximo 6 boletas votadas y 6 boletas en blanco por elección. Los candidatos, y cualquier persona que trabaje o sea voluntaria para un partido, un candidato o un grupo de campaña, no pueden usar las excepciones de familiar, casa o cuidador. Violar esta ley es un delito menor (misdemeanor). Es un delito grave (felony) si alguien que no es el votante le pagó a usted, o si se trata de 10 boletas o más. Este sitio nunca recogerá ni entregará boletas."
  source: { name: "Idaho Code 18-2324", url: "https://legislature.idaho.gov/statutesrules/idstat/title18/t18ch23/sect18-2324/" }
  verified: true

