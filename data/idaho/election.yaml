  value:
    en: "(208) 334-2852. elections@sos.idaho.gov. 700 W Jefferson, #E205, Boise, ID 83702 (State Capitol, East Wing, 2nd floor). Monday to Friday, 8 a.m. to 5 p.m."
    es: "(208) 334-2852. elections@sos.idaho.gov. 700 W Jefferson, #E205, Boise, ID 83702 (Capitolio Estatal, Ala Este, 2.º piso). De lunes a viernes, de 8 a.m. a 5 p.m."
  note:
    en: "For questions about your own ballot or polling place, your county elections office is usually the faster help."
    es: "Si tiene preguntas sobre su propia boleta o su lugar de votación, por lo general la oficina de elecciones de su condado le puede ayudar más rápido."
  source: { name: "VoteIdaho", url: "https://voteidaho.gov/voter-registration/" }
  verified: true
