pick:
  label: two-way
  candidate: "Lori Hickman"
  rule: "Rule 3: only one non-Republican on the ballot."
  reasoning: "Hickman is the only non-Republican on the ballot, so this is a two-way race and turnout is what matters. The 25-point margin in 2022 was the closest statewide race that year, and the Democrat carried Ada County (Arkoosh 95,467 to Labrador 88,131). It is still a long shot statewide, with no public poll."
