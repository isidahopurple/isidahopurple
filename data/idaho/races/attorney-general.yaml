office:
  en: "Attorney General"
  es: Fiscal General
level: statewide
order: 11
depth: full
controls:
  en: "The Attorney General is the state's lawyer: the office represents state agencies in court, advises them on the law, and issues legal opinions to legislators and statewide officers on request. The Attorney General also sits on the State Land Board."
  es: 'El fiscal general es el abogado del estado: la oficina representa a las agencias estatales en los tribunales, les da asesoría legal y, cuando se lo piden, emite opiniones legales para los legisladores y los funcionarios estatales. El fiscal general también es miembro de la Junta de Tierras del Estado (State Land Board).'
controls_source:
  name: "Idaho Code 67-1401 (duties of the Attorney General)"
  url: "https://legislature.idaho.gov/statutesrules/idstat/title67/t67ch14/sect67-1401/"
candidates:
  - name: "Raul R. Labrador"
    party: R
    incumbent: true
    bio:
      en: "Attorney General since 2023; former U.S. Representative for Idaho's 1st District and a founding member of the House Freedom Caucus."
      es: Fiscal general desde 2023; fue representante de EE. UU. por el Distrito 1 de Idaho y miembro fundador del House Freedom Caucus.
    website: "https://raullabrador.com/"
    quote:
      text: "When I ran for Attorney General, I promised to aggressively defend Idaho's values. The legal battles over life, parental rights, and fairness in women's sports are far from over. Idahoans deserve an Attorney General who shares their conservative principles, stands firm, takes these fights to the highest courts, and never apologizes for defending our laws."
      translation_es: Cuando me postulé para fiscal general, prometí defender con fuerza los valores de Idaho. Las batallas legales sobre la vida, los derechos de los padres y la justicia en los deportes femeninos están lejos de terminar. Los habitantes de Idaho merecen un fiscal general que comparta sus principios conservadores, que se mantenga firme, que lleve estas luchas hasta los tribunales más altos y que nunca pida disculpas por defender nuestras leyes.
      date: "2026-02-26"
      context: "Statement announcing that he filed for re-election, as reported by KMVT."
      source:
        name: "KMVT: Idaho's attorney general announces his run for re-election"
        url: "https://www.kmvt.com/2026/02/27/idahos-attorney-general-announces-his-run-re-election/"
        date: "2026-02-26"
      verified: true
  - name: "Lori Hickman"
    party: D
    bio:
      en: "Boise attorney with about 20 years of practice; former board chair of Mormon Women for Ethical Government."
      es: Abogada de Boise con unos 20 años de experiencia; fue presidenta de la junta directiva de Mormon Women for Ethical Government.
    website: "https://www.lori4idaho.com/"
    quote:
      text: "The attorney general is the people's lawyer. This office must be grounded in ethics, sound legal analysis, and respect for the Constitution. Idaho deserves an attorney general who puts people and the legal process ahead of politics."
      translation_es: El fiscal general es el abogado del pueblo. Esta oficina debe basarse en la ética, en un análisis legal sólido y en el respeto a la Constitución. Idaho merece un fiscal general que ponga a las personas y el proceso legal por encima de la política.
      date: "2026-02-27"
      context: "Statement announcing her campaign, in an Idaho Democratic Party release."
      source:
        name: "Idaho Democratic Party: Lori Hickman announces campaign for Idaho Attorney General"
        url: "https://idahodems.org/lori-hickman-announces-campaign-for-idaho-attorney-general-promises-professional-people-first-leadership/"
        date: "2026-02-27"
      verified: true
