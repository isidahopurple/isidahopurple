history:
  - year: 2022
    label: "2022 Idaho Attorney General"
    result: "Labrador (R) 62.6, Arkoosh (D) 37.4"
    margin: "R+25.2"
    source:
      name: "Idaho Secretary of State, 2022 General Election canvass (statewide, by county)"
      url: "https://archive.sos.idaho.gov/elections/data/results/2022/2022_General_Canvass.zip"
pick:
  label: two-way
  candidate: "Lori Hickman"
  rule: "Rule 3: only one non-Republican on the ballot."
  reasoning:
    en: "Hickman is the only non-Republican on the ballot, so this is a two-way race and turnout is what matters. The 25-point margin in 2022 was the closest statewide race that year, and the Democrat carried Ada County (Arkoosh 95,467 to Labrador 88,131). It is still a long shot statewide, with no public poll."
    es: Hickman es la única candidata no republicana en la boleta, así que es una contienda entre dos y lo que importa es la participación. La diferencia de 25 puntos en 2022 fue la contienda estatal más cerrada de ese año, y la demócrata ganó en el condado de Ada (Arkoosh 95,467 contra Labrador 88,131). Aun así, a nivel estatal es muy difícil que gane, y no hay ninguna encuesta pública.
  approved: false
scenarios: []
review_flags: []
unverified:
  - "The Change Research poll was paid for by a governor campaign, so it is not independent. Its memo gives field dates as \"July 28-39, 2026\", an obvious typo; July 28-30 is assumed."
