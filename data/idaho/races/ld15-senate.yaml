pick:
  label: two-way
  candidate: Nancy Gregory
  rule: '3'
  reasoning: 'Nancy Gregory is the only non-Republican on the ballot, so this is a two-way race and turnout
    is what matters. Open seat: Sen. Codi Galloway (R) is not on the ballot. The seat flipped from D+1.8
    in 2022 to R+3.7 in 2024, so turnout and avoiding undervotes decide it. District lines were the same
    in 2022 and 2024 (the post-2020-census map), so both results compare directly.'
  approved: false
