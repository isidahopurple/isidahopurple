candidates:
- name: Desi Burbank
  party: R
  incumbent: false
  website: https://www.desi4idaho.com
  quote:
    text: I believe our state legislature should be made up of people who listen, work hard, and focus on practical solutions that help Idaho families thrive. I'm running for the Idaho State Legislature because I want to bring a strong voice for families, schools, and our community to the Capitol—and continue a lifetime commitment to serving others.
    translation_es: Creo que nuestra legislatura estatal debe estar formada por personas que escuchen, trabajen duro y se enfoquen en soluciones prácticas que ayuden a las familias de Idaho a salir adelante. Me postulo para la Legislatura del Estado de Idaho porque quiero llevar al Capitolio una voz fuerte a favor de las familias, las escuelas y nuestra comunidad, y seguir con el compromiso que he tenido toda la vida de servir a los demás.
    date: '2026-05-14'
    context: Her answer to "Who are you?" in the Ballotpedia candidate survey; the same text is on her campaign site.
    source:
