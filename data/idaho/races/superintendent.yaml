pick:
  label: clear
  candidate: "Becky Sundin Mitchell"
  rule: "Rule 2: no independent poll; the Democrat was the highest non-Republican finisher in 2022 (the only one on that ballot)."
  reasoning: "With no poll, the method points to the Democrat. Her party took about 30 percent here in 2022, while Constitution candidates drew 4 to 5 percent in other statewide races. This is a roughly 40-point race. One nuance: Critchfield supports parental choice but says the school choice tax credit policy \"lacks transparency and accountability\" (CBS2/KBOI survey), while both challengers oppose the credit (Idaho Education News)."
  approved: false
scenarios:
  - voters_of: "Teresa Roundy"
    text: "If you mainly want a change from the incumbent, the method says the Democrat is the non-Republican with a track record of real vote share in this race. If you agree with Roundy's platform, voting your values is also a legitimate choice."
