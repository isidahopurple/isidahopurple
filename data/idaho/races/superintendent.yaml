office:
  en: "Superintendent of Public Instruction"
  es: Superintendente de Instrucción Pública
level: statewide
order: 15
depth: full
controls:
  en: "The Superintendent leads the State Department of Education. The department carries out State Board of Education policy for K-12 schools, distributes state school funds, runs statewide testing and licenses educators. Local districts and charter schools run day-to-day operations, and the Legislature sets school funding."
  es: El superintendente dirige el Departamento de Educación del Estado. El departamento aplica las políticas de la Junta de Educación del Estado para las escuelas de kínder a 12.º grado, reparte los fondos escolares del estado, maneja los exámenes estatales y da las licencias a los educadores. Los distritos locales y las escuelas chárter manejan el día a día, y la Legislatura decide el financiamiento de las escuelas.
controls_source:
  name: "Idaho State Department of Education: About Us"
  url: "https://sde.idaho.gov/about-us/"
candidates:
  - name: "Debbie Critchfield"
    party: R
    incumbent: true
    bio:
      en: "Superintendent since 2023; from Oakley; former Cassia County school board member and former State Board of Education member."
      es: Superintendente desde 2023; de Oakley; fue miembro de la junta escolar del condado de Cassia y de la Junta de Educación del Estado.
    website: "https://debbie4idaho.com/"
    quote:
      text: "Four years ago, I promised to put Idaho’s students first and lead with integrity and common sense. I’m proud of the progress we’ve made together for Idaho’s students, families, schools and communities. There is still important work ahead, and I’m ready to keep building on what we’ve started."
      translation_es: Hace cuatro años prometí poner primero a los estudiantes de Idaho y dirigir con integridad y sentido común. Estoy orgullosa del progreso que hemos logrado juntos para los estudiantes, las familias, las escuelas y las comunidades de Idaho. Todavía queda trabajo importante por hacer, y estoy lista para seguir construyendo sobre lo que empezamos.
      date: "2026-08-24"
      context: "Answer to \"why should people vote for you?\" in the CBS2/KBOI 2026 candidate survey."
      source:
        name: "CBS2 / idahonews.com: 2026 general election survey, Superintendent of Public Instruction"
        url: "https://idahonews.com/politics/know-your-candidates/2026-general-election-survey-superintendent-of-public-instruction"
        date: "2026-08-24"
      verified: true
  - name: "Becky Sundin Mitchell"
    party: D
    bio:
      en: "2018 Idaho Teacher of the Year; middle school science teacher in Caldwell; lives in Canyon County."
      es: Maestra del Año de Idaho en 2018; maestra de ciencias de secundaria en Caldwell; vive en el condado de Canyon.
    website: "https://becky4idaho.com/"
    quote:
      text: "Idahoans should vote for me because the person leading public education should understand public education from the classroom up."
      translation_es: Los habitantes de Idaho deben votar por mí porque la persona que dirige la educación pública debe entender la educación pública desde el salón de clases.
      date: "2026-08-24"
      context: "Answer to \"why should people vote for you?\" in the CBS2/KBOI 2026 candidate survey."
      source:
        name: "CBS2 / idahonews.com: 2026 general election survey, Superintendent of Public Instruction"
        url: "https://idahonews.com/politics/know-your-candidates/2026-general-election-survey-superintendent-of-public-instruction"
        date: "2026-08-24"
      verified: true
  - name: "Teresa Roundy"
    party: C
    bio:
      en: "Garden City resident; former wildland firefighter and teacher."
      es: Vive en Garden City; fue bombera forestal y maestra.
    quote:
      text: "I am asking for your vote to help rebuild Idaho's schools into safe, world-class institutions."
      translation_es: Le pido su voto para ayudar a reconstruir las escuelas de Idaho y convertirlas en instituciones seguras y de primer nivel mundial.
      date: "2026-08-24"
      context: "Answer to \"why should people vote for you?\" in the CBS2/KBOI 2026 candidate survey."
      source:
        name: "CBS2 / idahonews.com: 2026 general election survey, Superintendent of Public Instruction"
        url: "https://idahonews.com/politics/know-your-candidates/2026-general-election-survey-superintendent-of-public-instruction"
        date: "2026-08-24"
      verified: true
