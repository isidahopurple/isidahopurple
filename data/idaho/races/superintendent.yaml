    label: "2022 Idaho Superintendent of Public Instruction"
    result: "Critchfield (R) 69.8, Gilbert (D) 30.2"
    margin: "R+39.6"
    source:
      name: "Idaho Secretary of State, 2022 General Election canvass (statewide, by county)"
