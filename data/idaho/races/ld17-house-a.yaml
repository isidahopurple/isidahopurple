candidates:
- name: John Gannon
  party: D
  incumbent: true
  bio:
    en: Listed as a contact on the statement of purpose for H0897 (2026), a bill to narrow the data-center sales tax exemption and require energy and water reporting.
    es: Aparece como contacto en la declaración de propósito del H0897 (2026), un proyecto de ley para limitar la exención del impuesto sobre las ventas para los centros de datos y exigirles que reporten su uso de energía y agua.
- name: James R Nechwedowich
  party: R
  incumbent: false
