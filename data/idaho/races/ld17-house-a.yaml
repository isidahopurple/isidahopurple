- year: 2024
  label: 2024 LD17 House A
  result: Gannon (D) unopposed
  margin: uncontested
  source:
    name: Idaho Secretary of State, 2024 general election results by precinct (raw_races_general.xlsx)
    url: https://archive.sos.idaho.gov/elections/data/results/2024/raw_races_general.xlsx
pick:
  label: two-way
  candidate: John Gannon
  rule: '3'
  reasoning:
    en: 'John Gannon is the only non-Republican on the ballot, so this is a two-way race and turnout is what matters. This is a hold: a Democrat holds this seat now. Gannon was one of the three legislators behind H0897, the 2026 bipartisan data-center bill that passed both chambers but died when the House did not take up the Senate amendments.'
    es: 'John Gannon es la única opción no republicana en la boleta, así que es una contienda entre dos y lo que importa es la participación. Se trata de conservar el escaño: un demócrata ocupa este escaño ahora. Gannon fue uno de los tres legisladores detrás del H0897, el proyecto de ley bipartidista de 2026 sobre centros de datos. Fue aprobado en las dos cámaras, pero no se convirtió en ley porque la Cámara de Representantes no votó los cambios que hizo el Senado.'
  approved: false
