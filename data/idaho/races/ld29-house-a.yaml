pick:
  label: two-way
  candidate: Mary Shea
  rule: '3'
  reasoning:
    en: 'Mary Shea is the only non-Republican on the ballot, so this is a two-way race and turnout decides it. This is the third straight matchup: Rep. Dustin Manwaring (R) beat Shea by 4.4 points in 2022 and by 10.4 points in 2024, on the same district lines in Pocatello (Bannock County). A 10-point gap is a lot to close, so this is a reach seat rather than a toss-up, and it would take a large turnout shift.'
    es: 'Mary Shea es la única opción no republicana en la boleta, así que es una contienda entre dos y la participación la decide. Es la tercera vez seguida que se enfrentan: el representante Dustin Manwaring (R) le ganó a Shea por 4.4 puntos en 2022 y por 10.4 puntos en 2024, con los mismos límites de distrito en Pocatello (condado de Bannock). Una diferencia de 10 puntos es mucho por recuperar, así que este escaño es difícil y no un empate, y haría falta un gran cambio en la participación.'
  approved: true
review_flags:
- 'Rep. Dustin Manwaring (R): Voted aye on H0897 (2026 bill that narrows the data-center sales tax exemption and adds energy and water criteria) when it passed the House 68-0. The vote was unanimous, so it is weak evidence of a match on power bills and data centers, and his campaign site also calls for more power generation and transmission "to support a growing population and demand from data centers." Mary Shea''s position on data centers was not found. A human should review.'
unverified:
- Manwaring's voting record on abortion access and climate was not reviewed. His campaign site's issues page does not mention abortion or climate.
- Mary Shea's position on data centers and power bills was not found. Her site's 2024 questionnaire answers support a clean-energy transition and "Idaho's energy providers and their fair applications of prices."
- The date of Manwaring's campaign issues page (quoted in the review flag) is unknown.
