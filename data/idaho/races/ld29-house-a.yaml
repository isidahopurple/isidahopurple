controls:
  en: The Idaho Legislature has 35 senators and 70 representatives, each elected for two-year terms; it levies taxes, appropriates public funds and oversees state agencies, and each district elects one senator and two representatives.
  es: La Legislatura de Idaho tiene 35 senadores y 70 representantes, y cada uno se elige por un periodo de dos años. La Legislatura fija los impuestos, asigna los fondos públicos y supervisa las agencias estatales. Cada distrito elige a un senador y a dos representantes.
controls_source:
  name: Idaho Legislature, Idaho's Citizen Legislature
  url: https://legislature.idaho.gov/resources/citizenlegislature/
candidates:
- name: Dustin W. Manwaring
  party: R
  incumbent: true
  bio:
    en: Pocatello business and estate-planning attorney who has held this seat since 2020 (and served 2016–2018); he sits on the Appropriations Committee.
    es: Abogado de Pocatello especializado en empresas y planificación patrimonial, que ocupa este escaño desde 2020 (y lo ocupó de 2016 a 2018); forma parte del Comité de Asignaciones Presupuestarias.
  website: https://manwaringforidaho.org/
  quote:
    text: 'Good government should solve problems before they become crises, invest wisely where doing so will save money and remain transparent and accountable to the people. My commitment to Pocatello is simple: I will listen, respond and act.'
    translation_es: 'Un buen gobierno debe resolver los problemas antes de que se conviertan en crisis, invertir con prudencia cuando eso ahorre dinero y ser transparente y rendir cuentas a la gente. Mi compromiso con Pocatello es sencillo: escucharé, responderé y actuaré.'
    date: '2026-08-24'
    context: Closing lines of his answer to "why should people vote for you?" in a TV-station candidate survey.
    source:
      name: Idaho News (CBS2/FOX9), 2026 general election survey, State Representative District 29A
      url: https://idahonews.com/politics/know-your-candidates/2026-general-election-survey-state-representative-district-29a
      date: '2026-08-24'
    verified: true
- name: Mary Shea
  party: D
  incumbent: false
  bio:
    en: Pocatello attorney focused on child welfare cases and former Idaho State University instructor; the Democratic nominee for this seat in 2022 and 2024.
    es: Abogada de Pocatello dedicada a casos de bienestar infantil y exinstructora de la Universidad Estatal de Idaho; fue la candidata demócrata a este escaño en 2022 y 2024.
  website: https://www.maryforidaho.com/
  quote:
    text: I am not running to score political points. I am running to bring practical leadership, real-world experience, and a proven record of public service to the Idaho Legislature.
    translation_es: No me postulo para ganar puntos políticos. Me postulo para llevar a la Legislatura de Idaho un liderazgo práctico, experiencia real y una trayectoria comprobada de servicio público.
    date: '2026-08-24'
    context: From her answer to "why should people vote for you?" in a TV-station candidate survey.
    source:
      name: Idaho News (CBS2/FOX9), 2026 general election survey, State Representative District 29A
      url: https://idahonews.com/politics/know-your-candidates/2026-general-election-survey-state-representative-district-29a
      date: '2026-08-24'
    verified: true
