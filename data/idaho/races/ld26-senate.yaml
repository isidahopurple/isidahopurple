office:
  en: State Senate, District 26
  es: Senado estatal, Distrito 26
level: legislative
district: LD26
seat: Senate
order: 178
depth: full
controls:
  en: The Idaho Legislature has 35 senators and 70 representatives, each elected for two-year terms; it levies taxes, appropriates public funds and oversees state agencies, and each district elects one senator and two representatives.
  es: La Legislatura de Idaho tiene 35 senadores y 70 representantes, y cada uno se elige por un periodo de dos años. La Legislatura fija los impuestos, asigna los fondos públicos y supervisa las agencias estatales. Cada distrito elige a un senador y a dos representantes.
controls_source:
  name: Idaho Legislature, Idaho's Citizen Legislature
  url: https://legislature.idaho.gov/resources/citizenlegislature/
candidates:
- name: Ron Taylor
  party: D
  incumbent: true
  quote:
    text: The people of District 26 should vote for me for several reasons, the most important is that I prioritize people over politics. I do not adhere to a party platform, nor do I pledge to vote a certain way before legislation is even written.
    translation_es: La gente del Distrito 26 debe votar por mí por varias razones; la más importante es que pongo a las personas por encima de la política. No sigo la plataforma de ningún partido, ni me comprometo a votar de cierta manera antes de que una ley siquiera se escriba.
    date: '2026-08-24'
    context: His answer to why people should vote for him, in a TV-station candidate survey.
    source:
      name: Idaho News (CBS2/FOX9), 2026 general election candidate survey
      url: https://idahonews.com/politics/know-your-candidates/2026-general-election-survey-state-senate-district-26
      date: '2026-08-24'
    verified: true
- name: Bryan Hyde
  party: R
  incumbent: false
  bio:
    en: His campaign site describes a long career in talk radio, advertising and public speaking; no prior elected office found.
    es: Su sitio de campaña describe una larga carrera en programas de radio de opinión (talk radio), publicidad y oratoria; no encontramos ningún cargo de elección anterior.
  website: https://www.bryanhydeforsenate.com/
  quote:
    text: My vision is of a transparent, responsive and limited government that stays in its own lane, protects our rights and affords us the freedom to pursue happiness without undue interference.
    translation_es: Mi visión es un gobierno transparente, que responda a la gente y limitado, que no se meta donde no le toca, que proteja nuestros derechos y que nos dé la libertad de buscar la felicidad sin intervenciones indebidas.
    date: '2026-06-14'
    context: Campaign post "Why I'm Running for the Idaho Senate."
    source:
      name: Bryan Hyde for Senate
      url: https://www.bryanhydeforsenate.com/why-im-running-for-the-idaho-senate
      date: '2026-06-14'
    verified: true
- name: Shaila Tate
  party: I
  incumbent: false
  bio:
    en: Independent; says in a 2026 candidate survey that she has interned at the Legislature since age 18.
    es: Independiente; dice en una encuesta de candidatos de 2026 que ha hecho prácticas en la Legislatura desde los 18 años.
  quote:
    text: My top priorities for my district should be everyone's top priority, the Next Generation. A politician is only thinking about the next election, a patriot is always thinking about the next generation. I want to give the Next Gen. a voice!
    translation_es: 'Mis prioridades principales para mi distrito deberían ser la prioridad de todos: la Próxima Generación. Un político solo piensa en la próxima elección; un patriota siempre piensa en la próxima generación. ¡Quiero darle voz a la Próxima Generación!'
    date: '2026-08-24'
    context: Her top priorities, in a TV-station candidate survey.
    source:
      name: Idaho News (CBS2/FOX9), 2026 general election candidate survey
      url: https://idahonews.com/politics/know-your-candidates/2026-general-election-survey-state-senate-district-26
      date: '2026-08-24'
    verified: true
history:
- year: 2022
  label: 2022 LD26 Senate
  result: Taylor (D) 51.6, Lickley (R) 48.4
  margin: D+3.3
  source:
    name: Idaho Secretary of State, 2022 general election canvass (legislative)
    url: https://archive.sos.idaho.gov/elections/data/results/2022/2022_General_Canvass.zip
- year: 2024
  label: 2024 LD26 Senate
  result: Taylor (D) 45.6, Lickley (R) 43.9, Tate (I) 10.5
  margin: D+1.6
  source:
    name: Idaho Secretary of State, 2024 general election results by precinct (raw_races_general.xlsx)
    url: https://archive.sos.idaho.gov/elections/data/results/2024/raw_races_general.xlsx
pick:
  label: clear
  candidate: Ron Taylor
  rule: '2'
  reasoning:
    en: 'There is no independent poll of this race. Under rule 2 the pick is the non-Republican who finished highest last time: Ron Taylor (D) won in 2024 with 45.6%, while a different independent candidate (Kala Tate) took 10.5%. Taylor''s 2024 margin was 1.6 points, smaller than the independent''s share, so a split non-Republican vote could decide this seat. This is a hold: Taylor holds the seat now. District lines were the same in 2022 and 2024 (the post-2020-census map), so both results compare directly.'
    es: 'No hay ninguna encuesta independiente de esta contienda. Según la regla 2, la recomendación es la opción no republicana que quedó más alto la última vez: Ron Taylor (D) ganó en 2024 con el 45.6%, mientras que otra candidatura independiente (Kala Tate) sacó el 10.5%. La diferencia de Taylor en 2024 fue de 1.6 puntos, menos que el porcentaje de esa candidatura independiente, así que dividir el voto no republicano podría decidir este escaño. Se trata de conservar el escaño: Taylor ocupa el escaño ahora. Los límites del distrito fueron los mismos en 2022 y 2024 (el mapa posterior al censo de 2020), así que los dos resultados se pueden comparar directamente.'
  approved: false
scenarios:
- voters_of: Shaila Tate
  text:
    en: 'If you are drawn to Shaila Tate, that is a real choice and an independent voice matters. The numbers are worth knowing, though: in 2024 an independent candidate took about 10% here and the seat was decided by 1.6 points. If your main goal is to keep this seat from going to the Republican candidate, Ron Taylor is the non-Republican who has won it twice. If you prefer Tate on the issues, vote for her; this is only about how the math works in a close three-way race.'
    es: 'Si le atrae Shaila Tate, es una opción real y una voz independiente importa. Aun así, vale la pena conocer los números: en 2024 una candidatura independiente sacó cerca del 10% aquí y el escaño se decidió por 1.6 puntos. Si lo que más quiere es evitar que este escaño quede en manos del candidato republicano, Ron Taylor es la opción no republicana que lo ha ganado dos veces. Si prefiere a Tate por sus posturas, vote por ella; esto solo explica cómo funcionan los números en una contienda cerrada de tres candidatos.'
unverified:
- Shaila Tate (2026) is not the same person as Kala Tate, the 2024 independent candidate. Her survey answer mentions her mother's and grandmother's 2024 campaigns, which suggests a family link; that is an inference, not confirmed.
