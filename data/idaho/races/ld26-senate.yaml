history:
- year: 2022
  label: 2022 LD26 Senate
  result: Taylor (D) 51.6, Lickley (R) 48.4
  margin: D+3.3
  source:
    name: Idaho Secretary of State, 2022 general election canvass (legislative)
    url: https://archive.sos.idaho.gov/elections/data/results/2022/2022_General_Canvass.zip
- year: 2024
  label: 2024 LD26 Senate
  result: Taylor (D) 45.6, Lickley (R) 43.9, Tate (I) 10.5
  margin: D+1.6
  source:
    name: Idaho Secretary of State, 2024 general election results by precinct (raw_races_general.xlsx)
    url: https://archive.sos.idaho.gov/elections/data/results/2024/raw_races_general.xlsx
pick:
  label: clear
  candidate: Ron Taylor
  rule: '2'
  reasoning: 'There is no independent poll of this race. Under rule 2 the pick is the non-Republican who
    finished highest last time: Ron Taylor (D) won in 2024 with 45.6%, while a different independent candidate
    (Kala Tate) took 10.5%. Taylor''s 2024 margin was 1.6 points, smaller than the independent''s share,
    so a split non-Republican vote could decide this seat. This is a hold: Taylor holds the seat now.
    District lines were the same in 2022 and 2024 (the post-2020-census map), so both results compare
    directly.'
  approved: false
scenarios:
- voters_of: Shaila Tate
  text: 'If you are drawn to Shaila Tate, that is a real choice and an independent voice matters. The
    numbers are worth knowing, though: in 2024 an independent candidate took about 10% here and the seat
    was decided by 1.6 points. If your main goal is to keep this seat from going to the Republican candidate,
    Ron Taylor is the non-Republican who has won it twice. If you prefer Tate on the issues, vote for
    her; this is only about how the math works in a close three-way race.'
unverified:
- Shaila Tate (2026) is not the same person as Kala Tate, the 2024 independent candidate. Her survey answer
  mentions her mother's and grandmother's 2024 campaigns, which suggests a family link; that is an inference,
  not confirmed.
