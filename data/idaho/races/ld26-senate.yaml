- name: Ron Taylor
  party: D
  incumbent: true
  quote:
    text: The people of District 26 should vote for me for several reasons, the most important is that
      I prioritize people over politics. I do not adhere to a party platform, nor do I pledge to vote
      a certain way before legislation is even written.
