office: State Senate, District 26
level: legislative
district: LD26
seat: Senate
order: 178
depth: full
controls: The Idaho Legislature has 35 senators and 70 representatives, each elected for two-year terms;
  it levies taxes, appropriates public funds and oversees state agencies, and each district elects one
  senator and two representatives.
controls_source:
  name: Idaho Legislature, Idaho's Citizen Legislature
  url: https://legislature.idaho.gov/resources/citizenlegislature/
