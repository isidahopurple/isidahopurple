depth: full
controls:
  en: The Idaho Legislature has 35 senators and 70 representatives, each elected for two-year terms; it levies taxes, appropriates public funds and oversees state agencies, and each district elects one senator and two representatives.
  es: La Legislatura de Idaho tiene 35 senadores y 70 representantes, y cada uno se elige por un periodo de dos años. La Legislatura fija los impuestos, asigna los fondos públicos y supervisa las agencias estatales. Cada distrito elige a un senador y a dos representantes.
controls_source:
  name: Idaho Legislature, Idaho's Citizen Legislature
  url: https://legislature.idaho.gov/resources/citizenlegislature/
candidates:
- name: Dan Foreman
  party: R
  incumbent: true
  bio:
    en: State senator from Viola (Latah County) and retired U.S. Air Force colonel and Moscow police officer; he beat Rep. Lori McCann in the May 2026 Republican primary.
    es: Senador estatal de Viola (condado de Latah), coronel retirado de la Fuerza Aérea de EE. UU. y policía retirado de Moscow; ganó a la representante Lori McCann en la primaria republicana de mayo de 2026.
  quote:
    text: I stand for small, efficient government that abides by the limitations of the Constitution. I am absolutely Pro-Life, and believe we must decrease taxes and government intervention in the private sector.
    translation_es: Defiendo un gobierno pequeño y eficiente que respete los límites de la Constitución. Soy totalmente provida y creo que debemos bajar los impuestos y reducir la intervención del gobierno en el sector privado.
    date: '2022-04-14'
    context: His answer to "Who are you?" in the 2022 Ballotpedia candidate survey. He did not answer the 2026 Ballotpedia or CBS2/FOX9 surveys, and no newer statement of his platform was found.
    source:
      name: Ballotpedia candidate survey (secondary source)
      url: https://ballotpedia.org/Dan_Foreman
      date: '2022-04-14'
    verified: true
- name: Robin Weldy
  party: D
  incumbent: false
  bio:
    en: Lewiston native and real estate investor with a finance degree; she won the May 2026 Democratic primary over Richard Gayler.
    es: Nacida en Lewiston, inversionista en bienes raíces y licenciada en finanzas; ganó la primaria demócrata de mayo de 2026 frente a Richard Gayler.
  website: https://www.weldyforidaho.com/
  quote:
    text: Idaho’s District 6 deserves a dedicated, practical leader focused on real local solutions rather than political grandstanding. As a Lewiston native, local business owner, and finance graduate, I bring more than 25 years of real-world experience managing budgets, navigating property assets, and solving tough economic problems.
    translation_es: El Distrito 6 de Idaho merece a una líder dedicada y práctica, enfocada en soluciones locales reales y no en el lucimiento político. Como nativa de Lewiston, dueña de un negocio local y graduada en finanzas, aporto más de 25 años de experiencia práctica administrando presupuestos, manejando propiedades y resolviendo problemas económicos difíciles.
    date: '2026-08-24'
    context: Opening of her answer to "why should people vote for you?" in a TV-station candidate survey.
    source:
      name: Idaho News (CBS2/FOX9), 2026 general election survey, State Senate District 6
      url: https://idahonews.com/politics/know-your-candidates/2026-general-election-survey-state-senate-district-6
      date: '2026-08-24'
    verified: true
