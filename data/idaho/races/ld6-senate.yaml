pick:
  label: two-way
  candidate: Robin Weldy
  rule: '3'
  reasoning:
    en: Robin Weldy is the only non-Republican on the ballot, so this is a two-way race and turnout decides it. Sen. Dan Foreman (R) won this seat by 2.1 points in 2022 and 6.7 points in 2024 on the same district lines, so it is competitive but has gone Republican both times. District 6 is Latah County (Moscow), Lewis County and part of Nez Perce County including part of Lewiston; about three in four votes for this seat in 2024 were cast in Latah County.
    es: Robin Weldy es la única opción no republicana en la boleta, así que es una contienda entre dos y la participación la decide. El senador Dan Foreman (R) ganó este escaño por 2.1 puntos en 2022 y por 6.7 puntos en 2024 con los mismos límites de distrito, así que es competitivo, pero las dos veces lo ganó el Partido Republicano. El Distrito 6 abarca el condado de Latah (Moscow), el condado de Lewis y parte del condado de Nez Perce, incluida parte de Lewiston; en 2024, cerca de tres de cada cuatro votos para este escaño se emitieron en el condado de Latah.
  approved: true
review_flags: []
unverified:
- The 2026 primary results (Foreman 52.7% to McCann 47.3%; Weldy 52.3% to Gayler 47.7%) come from Ballotpedia and were not checked against the Secretary of State's primary canvass.
- Foreman's quote is from 2022. No 2026 campaign website or survey answers from him were found.
- Foreman's record on abortion access, climate, and power bills or data centers was not reviewed beyond H0897 (the 2026 data-center tax bill), where he is recorded absent. His 2022 survey says he will "work to abolish abortions", so a match on abortion access is unlikely.
- Which parts of Lewiston are in District 6 was not checked against the district map. The 2022 and 2024 results show part of Nez Perce County in the district, and Weldy's filing address and Rep. Lori McCann's legislative address are in Lewiston.
