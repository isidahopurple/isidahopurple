pick:
  label: clear
  candidate: Anita Janis
  rule: '2'
  reasoning:
    en: 'There is no independent poll of this race. Under rule 2 the pick is the non-Republican candidate or party that finished highest last time: the Democratic nominee (Ned Burns) took 48.8% in 2024 and won the seat in 2022 by 37 votes. Anita Janis is the 2026 Democratic nominee. With a 2.4-point margin in 2024 and an independent now on the ballot, a split non-Republican vote could decide this seat. District lines were the same in 2022 and 2024 (the post-2020-census map), so both results compare directly.'
    es: 'No hay ninguna encuesta independiente de esta contienda. Según la regla 2, la recomendación es el candidato o partido no republicano que quedó más alto la última vez: la opción demócrata (Ned Burns) sacó el 48.8% en 2024 y ganó el escaño en 2022 por 37 votos. Anita Janis es la candidata demócrata en 2026. Con una diferencia de 2.4 puntos en 2024 y ahora con una candidata independiente en la boleta, dividir el voto no republicano podría decidir este escaño. Los límites del distrito fueron los mismos en 2022 y 2024 (el mapa posterior al censo de 2020), así que los dos resultados se pueden comparar directamente.'
  approved: true
scenarios:
- voters_of: Bella Schiffler
  text:
    en: 'If Bella Schiffler speaks for you, that is a fair choice. It helps to know the history: this seat was decided by 37 votes in 2022 and by 2.4 points in 2024, with only two candidates both times. The Democratic nominee has come closest to the Republican each time. If your main goal is to change who holds this seat, Anita Janis is the candidate the numbers point to. If you prefer Schiffler on the issues, vote for her.'
    es: 'Si Bella Schiffler habla por usted, es una decisión válida. Ayuda conocer la historia: este escaño se decidió por 37 votos en 2022 y por 2.4 puntos en 2024, con solo dos candidatos las dos veces. La opción demócrata ha quedado más cerca del republicano cada vez. Si lo que más quiere es cambiar quién ocupa este escaño, Anita Janis es la candidata que señalan los números. Si prefiere a Schiffler por sus posturas, vote por ella.'
review_flags:
- 'Rep. Mike Pohanka (R): Voted aye on H0897 (2026 data-center tax bill) when it passed the House 68-0. The vote was unanimous, so it is weak evidence of a match on power bills and data centers, but a human should review.'
