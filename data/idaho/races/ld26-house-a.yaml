candidates:
- name: Mike Pohanka
  party: R
  incumbent: true
  website: https://mikepohanka.com/
  quote:
    text: 'My approach to governing is simple: get all the parties in the room, talk it through, and work the problem. I ran on the promise to be your voice, not Boise''s voice back home — and that''s a promise I intend to keep.'
    translation_es: 'Mi manera de gobernar es sencilla: reunir a todas las partes, hablarlo y resolver el problema. Hice campaña con la promesa de ser la voz de ustedes, no la voz de Boise aquí en casa, y es una promesa que pienso cumplir.'
    date: '2026-08-24'
    context: His answer on representing constituents, in a TV-station candidate survey.
    source:
      name: Idaho News (CBS2/FOX9), 2026 general election candidate survey
      url: https://idahonews.com/politics/know-your-candidates/2026-general-election-survey-state-representative-district-26a
      date: '2026-08-24'
    verified: true
- name: Anita Janis
  party: D
  incumbent: false
  website: https://www.anitajanisforidaho.com/
  quote:
    text: I am not a career politician and am not beholden to special interests or large donors. My campaign is built from the ground up, driven by genuine concern for the impact of recent legislation on everyday Idahoans. I am running because I believe we can do better.
    translation_es: No me dedico a la política como carrera y no le debo nada a los intereses especiales ni a los grandes donantes. Mi campaña se construye desde abajo, impulsada por una preocupación sincera por el efecto de las leyes recientes en la gente común de Idaho. Me postulo porque creo que podemos estar mejor.
    date: '2026-08-24'
    context: Her answer to why people should vote for her, in a TV-station candidate survey.
    source:
      name: Idaho News (CBS2/FOX9), 2026 general election candidate survey
      url: https://idahonews.com/politics/know-your-candidates/2026-general-election-survey-state-representative-district-26a
      date: '2026-08-24'
    verified: true
- name: Bella Schiffler
  party: I
  incumbent: false
  quote:
    text: I will put God’s voice back on top of the government mountain. Vote for me, Bella Schiffler, if you want truth, righteousness, purity, and ultimately God back on top of our government!
    translation_es: Voy a volver a poner la voz de Dios en la cima de la montaña del gobierno. Vote por mí, Bella Schiffler, si quiere la verdad, la rectitud, la pureza y, en fin, ¡a Dios de nuevo en la cima de nuestro gobierno!
    date: '2026-08-24'
    context: Closing lines of her answer to why people should vote for her, in a TV-station candidate survey.
