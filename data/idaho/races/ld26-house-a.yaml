  source:
    name: Idaho Secretary of State, 2022 general election canvass (legislative)
    url: https://archive.sos.idaho.gov/elections/data/results/2022/2022_General_Canvass.zip
- year: 2024
  label: 2024 LD26 House A
  result: Pohanka (R) 51.2, Burns (D) 48.8
  margin: R+2.4
  source:
    name: Idaho Secretary of State, 2024 general election results by precinct (raw_races_general.xlsx)
    url: https://archive.sos.idaho.gov/elections/data/results/2024/raw_races_general.xlsx
pick:
  label: clear
  candidate: Anita Janis
  rule: '2'
  reasoning: 'There is no independent poll of this race. Under rule 2 the pick is the non-Republican candidate
    or party that finished highest last time: the Democratic nominee (Ned Burns) took 48.8% in 2024 and
    won the seat in 2022 by 37 votes. Anita Janis is the 2026 Democratic nominee. With a 2.4-point margin
    in 2024 and an independent now on the ballot, a split non-Republican vote could decide this seat.
    District lines were the same in 2022 and 2024 (the post-2020-census map), so both results compare
    directly.'
  approved: false
scenarios:
- voters_of: Bella Schiffler
  text: 'If Bella Schiffler speaks for you, that is a fair choice. It helps to know the history: this
    seat was decided by 37 votes in 2022 and by 2.4 points in 2024, with only two candidates both times.
    The Democratic nominee has come closest to the Republican each time. If your main goal is to change
    who holds this seat, Anita Janis is the candidate the numbers point to. If you prefer Schiffler on
    the issues, vote for her.'
review_flags:
- 'Rep. Mike Pohanka (R): Voted aye on H0897 (2026 data-center tax bill) when it passed the House 68-0.
  The vote was unanimous, so it is weak evidence of a match on power bills and data centers, but a human
  should review.'
