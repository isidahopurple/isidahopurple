pick:
  label: two-way
  candidate: Nate Roberts
  rule: '3'
  reasoning:
    en: 'Nate Roberts is the only non-Republican on the ballot, so this is a two-way race and turnout decides it. Open seat: Rep. Tanya Burgoyne (R) lost the May primary to Jennifer Miles, so neither nominee is the incumbent. Roberts won this Pocatello (Bannock County) seat by 0.8 points (112 votes) in 2022 and lost it by 5.2 points in 2024 on the same district lines, so turnout can decide it.'
    es: 'Nate Roberts es la única opción no republicana en la boleta, así que es una contienda entre dos y la participación la decide. Escaño abierto: la representante Tanya Burgoyne (R) perdió la primaria de mayo ante Jennifer Miles, así que ninguno de los dos candidatos ocupa el escaño. Roberts ganó este escaño de Pocatello (condado de Bannock) por 0.8 puntos (112 votos) en 2022 y lo perdió por 5.2 puntos en 2024 con los mismos límites de distrito, así que la participación puede decidirlo.'
  approved: true
review_flags: []
unverified:
- The 2026 Republican primary result (Miles 1,814 to Burgoyne 1,774) comes from Ballotpedia and was not checked against the Secretary of State's primary canvass.
- Jennifer Miles's positions on abortion access, climate, and power bills or data centers were not found. Her campaign site loads by script and could not be read, and she did not answer the CBS2/FOX9 survey. Her Ballotpedia survey supports keeping public lands public and strong public schools, but does not mention those three issues.
