controls:
  en: The Idaho Legislature has 35 senators and 70 representatives, each elected for two-year terms; it levies taxes, appropriates public funds and oversees state agencies, and each district elects one senator and two representatives.
  es: La Legislatura de Idaho tiene 35 senadores y 70 representantes, y cada uno se elige por un periodo de dos años. La Legislatura fija los impuestos, asigna los fondos públicos y supervisa las agencias estatales. Cada distrito elige a un senador y a dos representantes.
controls_source:
  name: Idaho Legislature, Idaho's Citizen Legislature
  url: https://legislature.idaho.gov/resources/citizenlegislature/
candidates:
- name: Jennifer Miles
  party: R
  incumbent: false
  bio:
    en: Pocatello clinical social worker and owner of two small businesses, raised in Soda Springs; she beat Rep. Tanya Burgoyne in the May 2026 Republican primary by 40 votes.
    es: Trabajadora social clínica de Pocatello y dueña de dos pequeños negocios, criada en Soda Springs; ganó a la representante Tanya Burgoyne en la primaria republicana de mayo de 2026 por 40 votos.
  website: https://www.milesforidaho.com/
  quote:
    text: I have spent years working with families and small businesses here in Southeast Idaho, and know that decisions made closest to home are the ones that serve people best. I’m focused on strengthening neighborhoods, supporting local leadership, and making sure government listens to the people it serves.
    translation_es: He pasado años trabajando con familias y pequeños negocios aquí en el sureste de Idaho, y sé que las decisiones que se toman más cerca de casa son las que mejor sirven a la gente. Me enfoco en fortalecer los vecindarios, apoyar el liderazgo local y asegurar que el gobierno escuche a la gente a la que sirve.
    date: '2026-04-28'
    context: One of the three key messages of her campaign, in the Ballotpedia candidate survey.
    source:
      name: Ballotpedia candidate survey (secondary source)
      url: https://ballotpedia.org/Jennifer_Miles
      date: '2026-04-28'
    verified: true
- name: Nate Roberts
  party: D
  incumbent: false
  bio:
    en: Pocatello union electrician and IBEW Local 449 officer who held this seat for one term (2023–2024) before losing it to Tanya Burgoyne (R) in 2024.
    es: Electricista sindicalizado de Pocatello y dirigente del sindicato IBEW Local 449, que ocupó este escaño durante un periodo (2023–2024) antes de perderlo ante Tanya Burgoyne (R) en 2024.
  website: https://robertsforidaho.com/
  quote:
    text: I’m not running to be the loudest person in the room. I’m running to be effective. I will work across the aisle when it helps District 29, stand my ground when our values or interests are at stake, and always be willing to explain my vote to the people I represent.
    translation_es: No me postulo para ser la persona que más grita en la sala. Me postulo para ser eficaz. Trabajaré con el otro partido cuando eso ayude al Distrito 29, me mantendré firme cuando estén en juego nuestros valores o intereses, y siempre estaré dispuesto a explicar mi voto a la gente que represento.
    date: '2026-08-24'
    context: From his answer to "why should people vote for you?" in a TV-station candidate survey.
    source:
      name: Idaho News (CBS2/FOX9), 2026 general election survey, State Representative District 29B
      url: https://idahonews.com/politics/know-your-candidates/2026-general-election-survey-state-representative-district-29b
      date: '2026-08-24'
    verified: true
