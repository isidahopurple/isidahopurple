controls:
  en: The Idaho Legislature has 35 senators and 70 representatives, each elected for two-year terms; it levies taxes, appropriates public funds and oversees state agencies, and each district elects one senator and two representatives.
  es: La Legislatura de Idaho tiene 35 senadores y 70 representantes, y cada uno se elige por un periodo de dos años. La Legislatura fija los impuestos, asigna los fondos públicos y supervisa las agencias estatales. Cada distrito elige a un senador y a dos representantes.
controls_source:
  name: Idaho Legislature, Idaho's Citizen Legislature
  url: https://legislature.idaho.gov/resources/citizenlegislature/
candidates:
- name: Dori Healey
  party: R
  incumbent: true
  website: https://www.dori4idaho.com
  quote:
    text: District 15 is more than the place I represent—it is where I live, work, raise my family, care for patients, and run my business. I understand the challenges facing our community because I experience them alongside the people I serve.
    translation_es: 'El Distrito 15 es más que el lugar que represento: es donde vivo, trabajo, crío a mi familia, atiendo a mis pacientes y tengo mi negocio. Entiendo los retos de nuestra comunidad porque los vivo junto con la gente a la que sirvo.'
    date: '2026-09-24'
    context: Welcome message on her re-election campaign homepage (undated page, read 2026-09-24).
    source:
      name: Dori Healey campaign site
      url: https://www.dori4idaho.com/
    verified: true
- name: Jae Etchart
  party: D
  incumbent: false
  website: https://www.jae4idaho.com
  quote:
    text: We don't have to agree on everything to deserve my attention. As your representative, I'll listen, do my homework, and always remember who I was elected to serve.
    translation_es: No tenemos que estar de acuerdo en todo para que usted merezca mi atención. Como su representante, voy a escuchar, estudiar bien cada tema y siempre recordar a quién me eligieron para servir.
    date: '2026-09-24'
    context: Why she is running, on her campaign homepage (undated page, read 2026-09-24).
    source:
      name: Jae Etchart campaign site
      url: https://www.jae4idaho.com/
    verified: true
