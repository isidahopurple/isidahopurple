office:
  en: "U.S. House, District 1"
  es: Cámara de Representantes de EE. UU., Distrito 1
level: federal
district: "ID-1"
order: 3
depth: full
controls:
  en: "One of Idaho's two seats in the U.S. House, which votes on federal laws, taxes and spending; the term is two years. In Ada County, District 1 includes most of Meridian and Eagle, Kuna, and a small part of southwest Boise near Lake Hazel Road. Nearly all of Boise is in District 2."
  es: Uno de los dos escaños de Idaho en la Cámara de Representantes de EE. UU., que vota sobre las leyes federales, los impuestos y el gasto; el periodo es de dos años. En el condado de Ada, el Distrito 1 incluye la mayor parte de Meridian y Eagle, Kuna y una pequeña parte del suroeste de Boise cerca de Lake Hazel Road. Casi todo Boise está en el Distrito 2.
controls_source:
  name: "Idaho Press: Commission votes to adopt new legislative, congressional district maps (Ada County split under plan C-3)"
  url: "https://www.idahopress.com/news/local/commission-votes-to-adopt-new-legislative-congressional-district-maps-for-state/article_6f6fe0c6-e2b8-5d78-97ff-a5e684eacc2f.html"
  date: "2021-11-05"
candidates:
  - name: "Russ Fulcher"
    party: R
    incumbent: true
    bio:
      en: "U.S. Representative since 2019; grew up on a Meridian dairy farm; former high-tech executive and 10-year Idaho state senator."
      es: Representante de EE. UU. desde 2019; creció en una granja lechera de Meridian; fue ejecutivo de alta tecnología y senador estatal de Idaho por 10 años.
    website: "https://russfulcher.com/"
    quote:
      text: "Government exists to serve the people, not the other way around."
      translation_es: El gobierno existe para servir al pueblo, no al revés.
      date: "2026-09-24"
      context: "Featured statement on his campaign homepage (the page is undated; the date is when it was read)."
      source:
        name: "Russ Fulcher for Idaho campaign website"
        url: "https://russfulcher.com/"
      verified: true
  - name: "Kaylee Peterson"
    party: D
    bio:
      en: "Sixth-generation Idahoan and grassroots organizer from the north Eagle foothills; the Democratic nominee for this seat in 2024."
      es: Es de Idaho desde hace seis generaciones y organizadora comunitaria de las colinas del norte de Eagle; fue la candidata demócrata a este escaño en 2024.
    website: "https://kayleeforcongress.com/"
    quote:
      text: "I’m not running to represent the interests of corporate lobbyists or out-of-state billionaires. I’m running to represent you."
      translation_es: No me postulo para representar los intereses de los cabilderos de las corporaciones ni de los multimillonarios de otros estados. Me postulo para representarlo a usted.
      date: "2026-09-24"
      context: "About page of her campaign website (the page is undated; the date is when it was read)."
      source:
        name: "Kaylee Peterson for Congress: About"
        url: "https://kayleeforcongress.com/about/"
      verified: true
  - name: "Sarah Zabel"
    party: I
    bio:
      en: "Retired Air Force major general (31 years of service) who lives in Bayview; a Republican for three decades before leaving the party."
      es: Mayor general retirada de la Fuerza Aérea (31 años de servicio) que vive en Bayview; fue republicana por tres décadas antes de dejar el partido.
    website: "https://www.zabelforcongress.com/"
    quote:
      text: "Idaho is bearing the costs of a Congress that works for party leaders, not for us. I'm running to change that."
      translation_es: Idaho está pagando el precio de un Congreso que trabaja para los líderes de los partidos, no para nosotros. Me postulo para cambiar eso.
      date: "2026-09-24"
      context: "Headline statement on her campaign homepage (the page is undated; the date is when it was read)."
      source:
        name: "Sarah Zabel for Congress campaign website"
        url: "https://www.zabelforcongress.com/"
      verified: true
  - name: "Brendan J. Gomez"
    party: C
    bio:
      en: "Constitution Party nominee. KMVT reported on Sept. 18, 2026 that he pleaded guilty in Ada County to two counts of possessing child sexually exploitative material, with sentencing set for Nov. 16. His name remains on the ballot."
      es: Candidato del Partido de la Constitución. KMVT informó el 18 de septiembre de 2026 que se declaró culpable en el condado de Ada de dos cargos de posesión de material de explotación sexual infantil, y que su sentencia está programada para el 16 de noviembre. Su nombre sigue en la boleta.
