pick:
  label: clear
  candidate: "Kaylee Peterson"
  rule: "Rule 2: no independent poll; the Democrat was the highest non-Republican finisher in 2024 (25.4 percent)."
  reasoning:
    en: "There is no independent poll, so the method uses the last election, where Peterson (the same candidate) took 25 percent and no other non-Republican topped 2 percent. Both public polls were paid for by campaigns, and both show Peterson far ahead of Zabel on the real three-way ballot (35 to 6 and 27 to 5). Zabel does well only in hypothetical head-to-heads without Peterson. This was a 46-point race in 2024, so a pick here will not change the outcome."
    es: No hay una encuesta independiente, así que el método usa la última elección, en la que Peterson (el mismo candidato) sacó el 25 por ciento y ningún otro candidato no republicano pasó del 2 por ciento. Las dos encuestas públicas fueron pagadas por campañas, y las dos muestran a Peterson muy por delante de Zabel en la boleta real de tres candidatos (35 a 6 y 27 a 5). A Zabel solo le va bien en enfrentamientos hipotéticos de uno contra uno sin Peterson. Esta contienda tuvo 46 puntos de diferencia en 2024, así que una recomendación aquí no va a cambiar el resultado.
  approved: true
scenarios:
  - voters_of: "Sarah Zabel"
    text:
      en: "Zabel's own poll found her at 6 percent on the actual ballot, with Peterson at 35. If your main goal is to replace Fulcher, the method points to Peterson. If you are voting for Zabel because of her record and positions, that is a legitimate choice. Just know that the head-to-head numbers her campaign cites assume Peterson is not on the ballot, and she is."
      es: La propia encuesta de Zabel le dio 6 por ciento en la boleta real, y a Peterson 35. Si lo que más quiere es reemplazar a Fulcher, el método señala a Peterson. Si vota por Zabel por su historial y sus posturas, esa es una decisión legítima. Solo sepa que los números de uno contra uno que cita su campaña suponen que Peterson no está en la boleta, y sí está.
  - voters_of: "Brendan J. Gomez"
    text:
      en: "Gomez remains on the ballot after pleading guilty to felony charges (KMVT, Sept. 18, 2026). He polled at 0 percent in the one public poll that included him."
      es: Gomez sigue en la boleta después de declararse culpable de delitos graves (KMVT, 18 de septiembre de 2026). Sacó 0 por ciento en la única encuesta pública que lo incluyó.
review_flags: []
unverified:
  - "The Ada County split comes from the 2021 redistricting coverage (plan C-3) and 2020 population counts. It has not been checked against a current precinct map."
  - "The date of Gomez's guilty plea is not stated in the KMVT article (it says only that he pleaded guilty). It has not been confirmed in iCourt."
  - "The Change Research memo gives its field dates as \"July 28-39, 2026\", an obvious typo. July 28-30 is assumed."
  - "Money through June 30 is from search summaries of Capital Sun reporting and was not read directly: Fulcher over $660K, Peterson about $181K, Zabel about $81.5K."
  - "Candidate-website quotes are undated. The date shown is when they were read."
