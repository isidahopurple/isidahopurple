pick:
  label: two-way
  candidate: Steve Berch
  rule: '3'
  reasoning: 'Steve Berch is the only non-Republican on the ballot, so this is a two-way race and turnout
    is what matters. This is a hold: Berch (D) holds this seat now. It was the closest 2024 legislative
    race in Ada County districts LD14-LD22 (227 votes), and this is a 2022 rematch with Keyser. District
    lines were the same in 2022 and 2024 (the post-2020-census map), so both results compare directly.'
  approved: false
