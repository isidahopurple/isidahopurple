office:
  en: "US Senate"
  es: Senado de EE. UU.
level: federal
order: 1
featured: true
depth: full

controls:
  en: >-
    One of Idaho's two US senators, elected for a six-year term. The Senate passes
    federal laws together with the House, votes to confirm or reject federal judges,
    Supreme Court justices and cabinet members, and approves treaties by a two-thirds vote.
  es: Uno de los dos senadores de EE. UU. por Idaho, elegido por un periodo de seis años. El Senado aprueba las leyes federales junto con la Cámara de Representantes. También vota para confirmar o rechazar a los jueces federales, a los jueces de la Corte Suprema y a los miembros del gabinete, y aprueba los tratados con dos tercios de los votos.
controls_source:
  name: "US Senate: Powers and Procedures"
  url: "https://www.senate.gov/about/powers-procedures.htm"

candidates:
  - name: "Jim Risch"
    party: R
    incumbent: true
    bio:
      en: >-
        US senator since 2009 and chairman of the Senate Foreign Relations Committee;
        former Idaho governor and lieutenant governor. Seeking a fourth term.
      es: Senador de EE. UU. desde 2009 y presidente del Comité de Relaciones Exteriores del Senado. Fue gobernador y vicegobernador de Idaho. Busca un cuarto periodo.
    website: "https://senatorrisch.com/"
    quote:
      text: >-
        It's a great time for America. I want to continue working with President Trump
        to get government out of the way. We now have a president who is focused on
        reducing government spending, returning power to the states, and cutting red
        tape—issues I have devoted my career to accomplishing.
      translation_es: Es un gran momento para Estados Unidos. Quiero seguir trabajando con el presidente Trump para que el gobierno no estorbe. Ahora tenemos un presidente enfocado en reducir el gasto del gobierno, devolver el poder a los estados y eliminar trámites innecesarios, temas a los que he dedicado mi carrera.
      date: "2025-04-04"
      context: "Risch campaign press release announcing his 2026 re-election campaign"
      source:
        name: "Jim Risch for U.S. Senate: Senator Risch Announces Re-election Campaign"
        url: "https://senatorrisch.com/senator-risch-announces-re-election-campaign-trump-endorses-risch/"
        date: "2025-04-04"
      verified: true

  - name: "Todd Achilles"
    party: I
    bio:
      en: >-
        Army veteran (tank commander and armor officer) and former Democratic state
        representative from Boise, running as an independent.
      es: Veterano del Ejército (comandante de tanque y oficial de blindados) y exrepresentante estatal demócrata de Boise. Se postula como independiente.
    website: "https://www.achillesforidaho.com/"
    quote:
      text: >-
        I am running as a candidate for the United States Senate because the two-party
        system has failed America. ... I reject the left-right divide because the
        challenge ahead of us is those at the top versus those at the bottom — those in
        power against the people. I will fight for all Idahoans, not billionaires or
        extremists.
      translation_es: 'Me postulo como candidato al Senado de los Estados Unidos porque el sistema de dos partidos le ha fallado a Estados Unidos. ... Rechazo la división entre izquierda y derecha porque el reto que tenemos por delante es el de los de arriba contra los de abajo: los que tienen el poder contra el pueblo. Voy a luchar por todos los habitantes de Idaho, no por los multimillonarios ni por los extremistas.'
      date: "2026-09-24"
      context: "Campaign website home page, his statement on why he is running (page is undated; date is when we read it)"
      source:
        name: "Achilles for Idaho (campaign website)"
        url: "https://www.achillesforidaho.com/"
      verified: true

  - name: "Natalie Fleming"
    party: I
    bio:
      en: >-
        Independent from the Treasure Valley with a technology and supply-chain
        background. Listed on the ballot as "Natalie M Fleming". She also ran for this
        seat in 2020 and got 3.0%.
      es: Independiente del Treasure Valley con experiencia en tecnología y cadenas de suministro. En la boleta aparece como "Natalie M Fleming". También fue candidata a este escaño en 2020 y sacó el 3.0%.
    website: "https://nataliefleming.info/"
    quote:
      text: >-
        When the earth is well cared for — the earth God gave us — there is plenty for
        all of us to prosper. That is what I believe. That is what I am running on.
      translation_es: Cuando la tierra se cuida bien, la tierra que Dios nos dio, hay suficiente para que todos prosperemos. Eso es lo que creo. Esa es la base de mi campaña.
      date: "2026-09-24"
      context: "Closing statement on the About page of her campaign website (page is undated; date is when we read it)"
      source:
        name: "Natalie Fleming for US Senate: About"
        url: "https://nataliefleming.info/about-natalie-m-fleming/"
      verified: true

  - name: "Matt Loesby"
    party: L
    bio:
      en: >-
        Software developer and Idaho Libertarian Party regional chair. He ran for the US
        House (1st District) in 2024 and got 2.1%.
      es: Desarrollador de software y presidente regional del Partido Libertario de Idaho. Fue candidato a la Cámara de Representantes de EE. UU. (Distrito 1) en 2024 y sacó el 2.1%.
    website: "https://www.loesby.us/"
    quote:
      text: >-
        The US Government is doing all it can to destroy our liberty, our culture, our
        wealth, and our future. Send me to Congress, so I can slow them down while we
        rebuild Idaho.
      translation_es: El gobierno de EE. UU. está haciendo todo lo posible por destruir nuestra libertad, nuestra cultura, nuestra riqueza y nuestro futuro. Mándenme al Congreso para poder frenarlos mientras reconstruimos Idaho.
      date: "2026-09-24"
      context: >-
        Home page of his campaign website. The text was written for his 2024 US House
        run, and the site is still the one he lists for 2026. Date is when we read it.
      source:
        name: "Matt Loesby for Idaho (campaign website)"
        url: "https://www.loesby.us/"
      verified: true

