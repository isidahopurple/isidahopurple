pick:
  label: clear
  candidate: "Todd Achilles"
  rule: >-
    Rule 1 (independent poll), with a caveat. The only poll not paid for by a campaign
    is Advanced Targeting Research (Sept 13–16). Its memo says no candidate commissioned
    it but does not name who did. Achilles is the top non-Republican in that poll and in
    every other 2026 poll, including Risch's own.
  reasoning:
    en: >-
      With the Democratic nominee off the ballot, Todd Achilles is the one non-Republican
      with a real base of support. The polls disagree sharply on the gap: Risch's own poll
      has him up 34 points, while the Advanced Targeting Research poll has Achilles up 11
      head-to-head. A Boise State political scientist says the gap is most likely down to
      how each poll decides who is a "likely voter." What the polls agree on is that no
      other challenger is close to Achilles, so if non-Republican voters come together
      behind him, this can become a real race. We are not predicting that he wins.
    es: 'Como el candidato demócrata ya no está en la boleta, Todd Achilles es el único candidato no republicano con una base real de apoyo. Las encuestas no coinciden para nada sobre la diferencia: la propia encuesta de Risch lo pone 34 puntos adelante, mientras que la encuesta de Advanced Targeting Research pone a Achilles 11 puntos adelante en un enfrentamiento directo. Un politólogo de Boise State dice que lo más probable es que la diferencia se deba a cómo cada encuesta decide quién es un "votante probable". En lo que sí coinciden las encuestas es que ningún otro retador está cerca de Achilles. Así que si los votantes no republicanos se unen detrás de él, esta puede volverse una contienda real. No estamos diciendo que él vaya a ganar.'
  approved: true

scenarios:
  - voters_of: "Natalie Fleming"
    text:
      en: >-
        Natalie Fleming is running on values many voters share. But she polled 8 to 9% in
        the two polls that included her, and Achilles polled 18 to 50% across all of them.
        If your main goal is a different senator than Jim Risch, a vote for Achilles is the
        one most likely to count toward that. If you vote for Fleming, you are voting for
        what she stands for, and that is a legitimate choice.
      es: Natalie Fleming defiende valores que comparten muchos votantes. Pero sacó de 8 a 9% en las dos encuestas que la incluyeron, y Achilles sacó de 18 a 50% en todas. Si lo que más quiere es tener un senador distinto a Jim Risch, un voto por Achilles es el que tiene más probabilidad de contar para eso. Si vota por Fleming, está votando por lo que ella defiende, y esa es una decisión legítima.
  - voters_of: "Matt Loesby"
    text:
      en: >-
        Matt Loesby polled 2 to 5%. If you are a libertarian voting to send a message, your
        vote does that. If you would mainly like to see Risch replaced, Achilles is the
        challenger with enough support to make that possible. He is also running as an
        independent, outside both parties.
      es: Matt Loesby sacó de 2 a 5% en las encuestas. Si usted es libertario y vota para mandar un mensaje, su voto lo hace. Si lo que más quiere es que reemplacen a Risch, Achilles es el retador con suficiente apoyo para hacerlo posible. Él también se postula como independiente, fuera de los dos partidos.
  - voters_of: "David Roth (withdrawn)"
    text:
      en: >-
        David Roth won the Democratic primary, then withdrew. His name will not be on the
        November ballot, so there is no Democrat to vote for in this race. The choices are
        Risch, Achilles, Fleming and Loesby.
      es: David Roth ganó la elección primaria demócrata y luego se retiró. Su nombre no estará en la boleta de noviembre, así que no hay un demócrata por quien votar en esta contienda. Las opciones son Risch, Achilles, Fleming y Loesby.
  - voters_of: "Undecided Republicans"
    text:
      en: >-
        If you have voted for Jim Risch before and are weighing your choice this time, read
        both men in their own words above. Achilles is running as an independent, not as a
        Democrat. Whichever way you go, the choice is yours to make, and we respect it.
      es: Si antes ha votado por Jim Risch y esta vez está pensando bien su decisión, lea arriba a los dos en sus propias palabras. Achilles se postula como independiente, no como demócrata. Decida lo que decida, la decisión es suya y la respetamos.
review_flags:
  - >-
    Poll sponsor: the only non-campaign poll (Advanced Targeting Research, Sept 13–16)
    does not name its sponsor. The memo says it "was not commissioned by any candidate
    in this race", which does not rule out a party or PAC. It is a little-known firm, and
    the poll left Natalie Fleming off the ballot question. The rule-1 pick of Achilles
    holds either way, because every poll has him as the top non-Republican.
  - >-
    Label: we used "clear" because every poll agrees on who the top non-Republican is.
    The polls conflict wildly on the Risch–Achilles margin (Risch +34 to Achilles +11).
    If you read rule 4 as "polls conflict means not-sure", change the label.
  - >-
    Power bills and data centers: no Risch statement on Idaho Power rates or data centers
    was found. His issues page backs nuclear energy and hydropower, which is not a match
    with the pick's position. As a legislator in 2025, Achilles questioned whether the
    utilities commission "lacks the tools" to measure the impact of data centers on rates
    (sourced below). No review flag was triggered on abortion, climate or power bills.

unverified:
  - "Who paid for the Advanced Targeting Research poll. The memo says no candidate commissioned it, and that is all it says."
  - "That the March Public Policy Polling survey was paid for by the Achilles campaign. Wikipedia says so, but the PPP memo does not name a client."
  - "The Fleming (9) and Loesby (2) numbers in Risch's August Peak Insights poll come from Wikipedia, which cites a reporter's post on X. The news story we cite confirms only Risch 52, Achilles 18."
  - "The Bullfinch sample size and margin of error (608 LV, ±3.9 for August; 774 RV, ±3.5 for May–June) come from Wikipedia. The Bullfinch pages we could read did not show them."
  - "Not listed in the poll table: two earlier polls that included David Roth (Peak Insights, June 6–7, for the Risch campaign, and a Change Research ballot from July 28–30). Roth is no longer on the ballot."
  - "The official SoS candidate list shows Roth's withdrawal dated Sept 1, 2026. News reports say he filed the form Aug 28, before the Sept 4 deadline. Either way his name is off the ballot."

