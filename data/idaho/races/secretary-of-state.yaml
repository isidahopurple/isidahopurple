office: "Secretary of State"
level: statewide
order: 12
depth: full
controls: "The Secretary of State is Idaho's chief election officer, responsible for applying election law uniformly across counties. The office also handles business filings and campaign finance disclosure, and the Secretary sits on the State Land Board."
controls_source:
  name: "Idaho Code 34-201 (Secretary of State as chief election officer)"
  url: "https://legislature.idaho.gov/statutesrules/idstat/title34/t34ch2/sect34-201/"
candidates:
  - name: "Phil McGrane"
    party: R
    incumbent: true
    bio: "Secretary of State since 2023; previously Ada County Clerk."
    website: "https://www.mcgraneforidaho.com/"
    quote:
      text: "I love Idaho, and I'm running to continue serving the people of Idaho. In just three years, we've strengthened accessibility, increased transparency, and built greater trust in our elections and business services, and we're just getting started."
