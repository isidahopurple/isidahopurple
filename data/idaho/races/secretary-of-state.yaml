pick:
  label: two-way
  candidate: "Shawn Keenan"
  rule: "Rule 3: only one non-Republican on the ballot."
  reasoning: "Keenan is the only non-Republican on the ballot, so this is a two-way race and turnout is what matters. It is a rematch of 2022, which McGrane won by about 45 points. For context on McGrane's record: Idaho refused a U.S. Justice Department demand for voter records including partial Social Security numbers and was sued over it on April 1, 2026, and McGrane backed the 2023 laws that removed student IDs as accepted voter ID."
  approved: false
