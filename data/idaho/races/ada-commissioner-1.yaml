office:
  en: Ada County Commissioner, District 1
  es: Comisionado del Condado de Ada, Distrito 1
level: county
district: Ada
seat: District 1
order: 300
depth: full
controls:
  en: The three-member Board of County Commissioners is Ada County's chief policy-making and administrative body; it adopts the county budget, sets the county property tax levy, and hears land-use and property-assessment appeals. Commissioners must live in their district, but every Ada County voter votes in both commissioner races on the ballot.
  es: La Junta de Comisionados del Condado, de tres miembros, es el principal órgano de políticas y de administración del Condado de Ada; aprueba el presupuesto del condado, fija el impuesto a la propiedad del condado y resuelve apelaciones sobre uso de suelo y avalúos de propiedades. Los comisionados deben vivir en su distrito, pero todos los votantes del Condado de Ada votan en las dos contiendas de comisionado que aparecen en la boleta.
controls_source:
  name: Ada County Board of Commissioners
  url: https://adacounty.id.gov/commissioners/
candidates:
- name: Ryan Davidson
  party: R
  incumbent: true
  bio:
    en: Ada County Commissioner for District 1 since January 2021; re-elected in 2024 and running for a four-year term.
    es: Comisionado del Condado de Ada por el Distrito 1 desde enero de 2021; reelegido en 2024 y ahora busca un periodo de cuatro años.
  website: https://ryanforidaho.com/
  quote:
    text: I’ve kept my promise to deliver on property tax relief. For the first time in over 40 years, Ada County cut your taxes. We’ve saved the taxpayers millions of dollars and have kept property taxes under control, while maintaining the high-quality level of service residents expect.
    translation_es: He cumplido mi promesa de dar alivio en el impuesto a la propiedad. Por primera vez en más de 40 años, el Condado de Ada le bajó los impuestos. Les hemos ahorrado millones de dólares a los contribuyentes y hemos mantenido bajo control los impuestos a la propiedad, sin dejar de dar el servicio de alta calidad que esperan los residentes.
    date: '2026-09-26'
    context: Opening section of his re-election campaign website (the page is undated; the date is when it was read).
    source:
      name: Re-Elect Ryan Davidson (campaign website)
      url: https://ryanforidaho.com/
    verified: true
- name: Kelceymarie Warner
  party: D
  incumbent: false
  bio:
    en: Ada County business owner who works in nonprofit communications and volunteers in Garden City, where she co-chairs a marketing committee.
    es: Dueña de un negocio en el Condado de Ada que trabaja en comunicaciones para organizaciones sin fines de lucro y es voluntaria en Garden City, donde copreside un comité de mercadeo.
  website: https://kelceymariewarnerforidaho.com/
  quote:
    text: I’m running for Ada County Commissioner to bring practical leadership, responsible financial management, and strong community engagement to ensure our county grows in a way that supports residents, businesses, and long-term sustainability.
    translation_es: Me postulo para comisionada del Condado de Ada para aportar un liderazgo práctico, un manejo financiero responsable y una fuerte participación comunitaria, y así asegurar que nuestro condado crezca de una manera que apoye a los residentes, a los negocios y la sostenibilidad a largo plazo.
    date: '2026-09-26'
    context: Her campaign statement in the League of Women Voters VOTE411 voter guide (undated; the date is when it was read).
    source:
      name: VOTE411 Voter Guide (League of Women Voters), Ada County Commissioner, District 1
      url: http://onyourballot.vote411.org/m/race-detail.do?id=72146543
    verified: true
history:
- year: 2024
  label: 2024 Ada County Commissioner, District 1
  result: Davidson (R) 57.5, Lashley (D) 42.5
  margin: R+15.0
  source:
    name: Ada County Elections, November 2024 official results
