pick:
  label: two-way
  candidate: Kelceymarie Warner
  rule: '3'
  reasoning:
    en: 'Kelceymarie Warner is the only non-Republican on the ballot, so this is a two-way race and turnout is what matters. Be realistic: Davidson won this seat by 15 points countywide in 2024, a presidential year.'
    es: 'Kelceymarie Warner es la única opción no republicana en la boleta, así que es una contienda entre dos y lo que importa es la participación. Seamos realistas: Davidson ganó este escaño por 15 puntos en todo el condado en 2024, un año de elección presidencial.'
  approved: true
review_flags: []
unverified:
- Both quotes come from undated pages (a campaign website and the VOTE411 guide); the date shown is when they were read.
- Warner's own campaign website did not load without JavaScript, so her bio comes from her VOTE411 answers.
