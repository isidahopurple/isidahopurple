office:
  en: Ada County Clerk (Clerk of the District Court)
  es: Secretario del Condado de Ada (Secretario del Tribunal de Distrito)
level: county
district: Ada
order: 304
depth: short
controls:
  en: The Clerk of the District Court is also the county auditor and recorder; in Ada County the office runs elections, keeps court records, records documents, issues marriage licenses, and handles the county budget and finance records.
  es: El secretario del Tribunal de Distrito también es el auditor y registrador del condado; en el Condado de Ada, la oficina organiza las elecciones, guarda los expedientes judiciales, registra documentos, emite licencias de matrimonio y lleva los registros del presupuesto y las finanzas del condado.
