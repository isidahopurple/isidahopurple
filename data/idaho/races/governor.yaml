office: "Governor"
level: statewide
order: 2
featured: true
depth: full

controls: >-
  Idaho's chief executive, elected for a four-year term. The governor signs or vetoes
  bills, can veto individual items in budget bills, and appoints many state officials,
  including the three Public Utilities Commissioners who set Idaho Power's rates (with
  state Senate approval).
controls_source:
  name: "Idaho Constitution, Article IV (Executive Department)"
  url: "https://legislature.idaho.gov/statutesrules/idconst/ArtIV/"

