office:
  en: "Governor"
  es: Gobernador
level: statewide
order: 2
featured: true
depth: full

controls:
  en: >-
    Idaho's chief executive, elected for a four-year term. The governor signs or vetoes
    bills, can veto individual items in budget bills, and appoints many state officials,
    including the three Public Utilities Commissioners who set Idaho Power's rates (with
    state Senate approval).
  es: Es el jefe del poder ejecutivo de Idaho y se elige por un periodo de cuatro años. El gobernador firma o veta los proyectos de ley, puede vetar partidas individuales en los proyectos de presupuesto y nombra a muchos funcionarios estatales. Entre ellos están los tres comisionados de la Comisión de Servicios Públicos (Public Utilities Commission), que fijan las tarifas de Idaho Power (con la aprobación del Senado estatal).
controls_source:
  name: "Idaho Constitution, Article IV (Executive Department)"
  url: "https://legislature.idaho.gov/statutesrules/idconst/ArtIV/"

candidates:
  - name: "Brad Little"
    party: R
    incumbent: true
    bio:
      en: >-
        Governor since 2019 and a former lieutenant governor. Seeking
        a third term.
      es: Gobernador desde 2019 y exvicegobernador. Busca un tercer periodo.
    website: "https://littleforidaho.com/"
    quote:
      text: >-
        Teresa and I are honored to serve the people of Idaho. Together, we've made Idaho
        the most prosperous state in the nation while fiercely defending our enduring
        core values — faith, family, and freedom.
      translation_es: 'Teresa y yo nos sentimos honrados de servir al pueblo de Idaho. Juntos, hemos hecho de Idaho el estado más próspero del país, mientras defendemos con firmeza nuestros valores fundamentales y duraderos: la fe, la familia y la libertad.'
      date: "2026-02-24"
      context: "Statement announcing his campaign for a third term, as reported by KIFI Local News 8"
      source:
        name: "KIFI Local News 8: Governor Brad Little to run for 3rd term"
        url: "https://localnews8.com/news/2026/02/24/governor-brad-little-to-run-for-3rd-term/"
        date: "2026-02-24"
      verified: true

  - name: "Terri Pickens"
    party: D
    bio:
      en: >-
        Boise attorney and founder of Pickens Law. Grew up in Pocatello. She ran for
        lieutenant governor in 2022.
      es: Abogada de Boise y fundadora de Pickens Law. Creció en Pocatello. Fue candidata a vicegobernadora en 2022.
    website: "https://terriforidaho.com/"
    quote:
      text: >-
        I grew up in Pocatello, where hard work and strong communities meant everything.
        We were taught to leave things better than we found them—and that's why I'm
        running for governor.
      translation_es: Crecí en Pocatello, donde el trabajo duro y las comunidades unidas lo eran todo. Nos enseñaron a dejar las cosas mejor de como las encontramos, y por eso me postulo para gobernadora.
      date: "2026-09-24"
      context: "Campaign website home page (undated; date is when we read it)"
      source:
        name: "Terri Pickens for Governor (campaign website)"
        url: "https://terriforidaho.com/"
      verified: true

  - name: "John Stegner"
    party: I
    bio:
      en: >-
        Former Idaho Supreme Court justice (2018–2023) who served about 25 years as a
        judge. Running as an independent. Listed on the ballot as "John R. Stegner".
      es: Exjuez de la Corte Suprema de Idaho (2018–2023) que fue juez durante unos 25 años. Se postula como independiente. En la boleta aparece como "John R. Stegner".
    website: "https://www.stegnerforidaho.com/"
    quote:
      text: >-
        Idaho deserves leaders who listen, solve problems, and do what's right when it
        matters most. ... I'm a lifelong Idahoan, former Idaho Supreme Court Justice, and
        principled leader running for Governor because I believe Idaho can do better.
      translation_es: Idaho merece líderes que escuchen, resuelvan problemas y hagan lo correcto cuando más importa. ... Soy de Idaho de toda la vida, exjuez de la Corte Suprema de Idaho y un líder con principios que se postula para gobernador porque creo que Idaho puede estar mejor.
      date: "2026-09-24"
      context: "Campaign website home page (undated; date is when we read it)"
      source:
        name: "John Stegner for Governor (campaign website)"
        url: "https://www.stegnerforidaho.com/"
      verified: true

  - name: "Paul Sand"
    party: L
    bio:
      en: >-
        Retired software engineer and former White Bird city council member. He was the
        2022 Libertarian nominee for governor and got 1.1%.
      es: Ingeniero de software jubilado y exmiembro del concejo municipal de White Bird. Fue el candidato libertario a gobernador en 2022 y sacó el 1.1%.
    website: "https://paulsand.org/"
    quote:
      text: >-
        Voting for me should be considered as a vote against the entire corrupt political
        establishment in Idaho. My campaign is not about me, it is about you.
      translation_es: Votar por mí debe verse como un voto en contra de todo el sistema político corrupto de Idaho. Mi campaña no se trata de mí, se trata de ustedes.
      date: "2026-09-03"
      context: "His campaign website, in the platform section below a Sept 3, 2026 update"
      source:
        name: "Paul Sand (campaign website)"
        url: "https://paulsand.org/"
      verified: true

  - name: "Pro-Life"
    party: C
    bio:
      en: >-
        Organic farmer from Letha, born Marvin Richardson, who legally changed his name to
        Pro-Life. He is a frequent Constitution Party candidate and got 5.1% for lieutenant
        governor in 2022.
      es: Agricultor orgánico de Letha. Nació con el nombre de Marvin Richardson y se cambió legalmente el nombre a Pro-Life. Es candidato frecuente del Partido de la Constitución y sacó el 5.1% en la elección para vicegobernador en 2022.
    website: "http://prolife-idaho.com/"
    quote:
      text: "Don't vote for the lesser of evils. You always have a choice. Vote by principle."
      translation_es: No voten por el menos malo. Siempre tienen opción. Voten por principios.
      date: "2026-09-24"
      context: "Headline of the campaign website he shares with his wife (undated; date is when we read it)"
      source:
        name: "ProLife Idaho (campaign website)"
        url: "http://prolife-idaho.com/"
      verified: true

  - name: "Jacob Burnett"
    party: I
    bio:
      en: >-
        Official write-in candidate. His name is not printed on the ballot. To vote for
        him you write his name in.
      es: Candidato oficial por escrito (write-in). Su nombre no aparece impreso en la boleta. Para votar por él, usted tiene que escribir su nombre.
