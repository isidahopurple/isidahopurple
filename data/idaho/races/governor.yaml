pick:
  label: clear
  candidate: "Terri Pickens"
  rule: >-
    Rule 1 (poll), confirmed by rule 2. Pickens is the top non-Republican in both public
    polls with all the main candidates, including the only one not paid for by a
    campaign. In 2022 the Democrat (20.3) also finished ahead of the independent (17.2).
    Owner's decision: Pickens is the pick, with a "Stegner voters" box.
  reasoning: >-
    In the Advanced Targeting Research poll, Little is at 37 with 20% undecided, so a
    majority is not locked in. Pickens (27) and Stegner (13) together come to 40. Pickens
    leads Stegner by 14 to 16 points in both three-way polls, so she is the challenger
    with the larger base. If voters who want a new governor come together, this can
    become a real race. The polls conflict, though: Stegner's own July poll has Little at
    48 and far ahead, and the sponsor of the September poll is not disclosed.
  approved: false

scenarios:
  - voters_of: "John Stegner"
    text: >-
      John Stegner spent about 25 years as a judge, including on the Idaho Supreme Court,
      and he is running a serious campaign. Plenty of Republicans and independents like
      him, and that is a good reason to take him seriously. Here is what your vote does.
      Idaho has no runoff: the Idaho Constitution says whoever gets the most votes wins,
      even with well under half. In the latest poll, Little has 37, Pickens 27 and
      Stegner 13. Together Pickens and Stegner are ahead of Little, but split two ways,
      neither one is. When the vote for change is divided, it helps whoever is already
      in front, and here that is Little. Pickens has more support in both three-way polls,
      including Stegner's own (27 to 11). If you are open to either challenger, a vote
      for Pickens is the one most likely to add up to a win. If you are a Republican who
      would never vote for a Democrat, your vote for Stegner is still a vote for a change
      in leadership, and you should cast it.
  - voters_of: "Paul Sand"
    text: >-
      Paul Sand says on his own website that beating Little is "very unlikely" and that a
      vote for him is a protest against the political establishment. If a protest vote is
      what you want, his name is on the ballot. If you would mainly like a different
      governor, Pickens is the challenger with the most support.
  - voters_of: "Pro-Life"
    text: >-
      Pro-Life asks voters to "vote by principle", and his website says a vote for him
      won't change the final outcome. If you vote for him on principle, that is your
      right. His positions are far from Pickens's, and we are not asking you to switch.
  - voters_of: "Jacob Burnett (write-in)"
    text: >-
      Burnett is an official write-in candidate, so his name is not printed on the
      ballot. A write-in vote counts only for a registered write-in candidate like him,
      and you have to write his name in yourself. If you would mainly like a different
      governor, Pickens is the challenger with the most support in the polls.
  - voters_of: "Undecided Republicans"
    text: >-
      If you have supported Brad Little before and are unsure this time, read each
      candidate in their own words above. Stegner is a former Idaho Supreme Court justice
      running as an independent, and Pickens is the Democratic nominee. Whoever you
      choose, it is your call, and we respect it.

review_flags:
  - >-
    Power bills and data centers (a Republican matches the pick's side): on July 24,
    2026, Gov. Little signed on to the White House "Ratepayer Protection Pledge". He said
    "we must ensure existing customers are not left paying the bill for new development"
    and that communities "should have a meaningful voice" when large data centers are
    proposed. That is close to Stegner's platform: data centers should prove resources
    are available, and communities should decide. We found no Pickens statement on
    Idaho Power rates or data centers. Please review before the page presents power
    bills as a reason to switch.
  - >-
    Poll sponsor: the September Advanced Targeting Research poll does not name a
    sponsor. It says only that no candidate commissioned it. Wikipedia's governor page
    lists the sponsor as "Self", and a search-engine summary claimed it was the Stegner
    campaign; neither claim is supported by the memo. Stegner's campaign paid for the July
    Change Research poll. The pick is Pickens in both polls either way.
  - >-
    Abortion: Stegner's website says he supports "Prop 1 should it be passed". Pickens
    backs reproductive rights. Little is not a match on abortion, so no flag is needed
    for him on that issue.

unverified:
  - "Who paid for the Advanced Targeting Research poll."
  - "The exact July 28–30 dates of the Change Research poll come from Wikipedia. The toplines document gives the sample (1,213 likely voters) and margin of error (±3.0) but no dates."
  - "Pickens has said she expects Stegner to pull Republican voters away from Little (Idaho Capital Sun, Aug 2026). We could not open the full article, so her exact words are not quoted here."
  - "Idaho Power is reported to be among Little's campaign donors (Spokesman-Review, May 1, 2026, from a search summary). We have not checked this against the campaign finance records."
  - "Pickens's position on data centers and Idaho Power rates. We found none on her website or in news searches."

