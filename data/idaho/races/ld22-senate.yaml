review_flags:
- Sen. Lori Den Hartog (R) was the Senate floor sponsor of H0897 (2026) and is listed as a contact on
  its statement of purpose. The bill would have narrowed the data-center sales tax exemption and added
  energy and water reporting; it passed both chambers (House 68-0, Senate 34-0) but died when the House
