  reasoning:
    en: Susan Counsil is the one candidate in reach for non-Republican voters. The other non-Republican on the ballot is from the Constitution Party, whose platform is generally to the right of the Republican Party, so this works as a two-way race where turnout matters.
    es: Susan Counsil es la única candidatura con posibilidades para los votantes no republicanos. La otra opción no republicana en la boleta es del Partido de la Constitución, cuya plataforma suele estar a la derecha del Partido Republicano, así que funciona como una contienda entre dos donde la participación decide.
