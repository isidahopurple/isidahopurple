pick:
  label: clear
  candidate: "Ellie Gilbreath"
  rule: "Rule 2: no independent poll; the Democrat was the highest non-Republican finisher in 2024 (31.0 percent, versus 5.2 for the Libertarian)."
  reasoning:
    en: "There is no poll, so the method uses 2024, when the Democrat took 31 percent and no other non-Republican topped 5. Simpson won the district by about 30 points, so realistically this seat is not in play. The Boise part voted for the Democrat, though, so Boise turnout is where a vote here counts most."
    es: No hay encuesta, así que el método usa 2024, cuando el demócrata sacó el 31 por ciento y ningún otro candidato no republicano pasó del 5. Simpson ganó el distrito por unos 30 puntos, así que en la realidad este escaño no está en juego. Pero la parte de Boise votó por el demócrata, así que la participación en Boise es donde un voto aquí cuenta más.
  approved: false
scenarios:
  - voters_of: "Will Johanson"
    text:
      en: "The Libertarian took about 5 percent in 2024. If your main goal is to replace Simpson, the method points to Gilbreath. If you vote Libertarian on principle, that is a legitimate choice."
      es: El candidato libertario sacó cerca del 5 por ciento en 2024. Si lo que más quiere es reemplazar a Simpson, el método señala a Gilbreath. Si vota por el Partido Libertario por principios, esa es una decisión legítima.
  - voters_of: "Emre Houser"
    text:
      en: "Houser had reported no fundraising to the FEC as of June 30, and no poll includes him. If your main goal is to replace Simpson, the method points to Gilbreath."
      es: Houser no había reportado ninguna recaudación de fondos a la FEC hasta el 30 de junio, y ninguna encuesta lo incluye. Si lo que más quiere es reemplazar a Simpson, el método señala a Gilbreath.
  - voters_of: "Tripp Charles Hutchinson"
    text:
      en: "Hutchinson's cost-of-living message overlaps with Gilbreath's, and his campaign had raised about $7,500 as of June 30. If your main goal is to replace Simpson, the method points to Gilbreath."
      es: El mensaje de Hutchinson sobre el costo de vida se parece al de Gilbreath, y su campaña había recaudado unos $7,500 hasta el 30 de junio. Si lo que más quiere es reemplazar a Simpson, el método señala a Gilbreath.
review_flags: []
unverified:
  - "C. Sierra (Constitution; ballot name \"C. Sierra - ID Law - Idaho Lorax\") is listed as Withdrawn on 2026-08-17 in the SoS candidate portal, before the Sept. 4 withdrawal deadline. KMVT/Capital Sun report the candidate died in June. The name should not appear on the ballot, but this has not been checked against a printed sample ballot. The earlier research listed this candidate as active."
  - "The Ada County split comes from the 2021 redistricting coverage (plan C-3) and 2020 population counts. It has not been checked against a current precinct map."
  - "Johanson's quote is a partial quote embedded in a news story, not a full sentence of his."
  - "Houser's quote is a campaign slogan. No first-person quote was found (he could not be reached by the Capital Sun)."
  - "Simpson's homepage quote refers to Biden-era border policy. It is what his campaign site features, but it may be older text. A more current Simpson quote on health care appears in the Capital Sun story linked in sources."
