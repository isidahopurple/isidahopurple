level: federal
district: "ID-2"
order: 4
depth: full
controls:
  en: "One of Idaho's two seats in the U.S. House, which votes on federal laws, taxes and spending; the term is two years. In Ada County, District 2 includes nearly all of Boise (about 232,000 of its 236,000 residents in 2020) plus small parts of Meridian and Eagle. The district also covers much of southeast Idaho."
  es: Uno de los dos escaños de Idaho en la Cámara de Representantes de EE. UU., que vota sobre las leyes federales, los impuestos y el gasto; el periodo es de dos años. En el condado de Ada, el Distrito 2 incluye casi todo Boise (unos 232,000 de sus 236,000 habitantes en 2020), además de pequeñas partes de Meridian y Eagle. El distrito también cubre gran parte del sureste de Idaho.
controls_source:
  name: "Idaho Press: Commission votes to adopt new legislative, congressional district maps (Ada County split under plan C-3)"
  url: "https://www.idahopress.com/news/local/commission-votes-to-adopt-new-legislative-congressional-district-maps-for-state/article_6f6fe0c6-e2b8-5d78-97ff-a5e684eacc2f.html"
  date: "2021-11-05"
candidates:
  - name: "Mike Simpson"
    party: R
    incumbent: true
    bio:
      en: "U.S. Representative since 1999; former Idaho legislator and former Blackfoot dentist."
      es: Representante de EE. UU. desde 1999; fue legislador de Idaho y dentista en Blackfoot.
    website: "https://simpsonforcongress.com/"
    quote:
      text: "Securing the border and stopping illegal immigration is the most important issue facing our nation today. I’ll stand with President Trump to end Biden’s disastrous open border policies, build the wall and stop illegal immigration once and for all."
      translation_es: Asegurar la frontera y detener la inmigración ilegal es el tema más importante que enfrenta nuestro país hoy. Voy a apoyar al presidente Trump para acabar con las desastrosas políticas de fronteras abiertas de Biden, construir el muro y detener la inmigración ilegal de una vez por todas.
      date: "2026-09-24"
      context: "Featured statement on his campaign homepage (the page is undated; the date is when it was read)."
      source:
        name: "Simpson for Congress campaign website"
        url: "https://simpsonforcongress.com/"
      verified: true
  - name: "Ellie Gilbreath"
    party: D
    bio:
      en: "Ketchum attorney and mediator whose campaign theme is \"Idaho is not for sale.\""
      es: Abogada y mediadora de Ketchum; el lema de su campaña es "Idaho no está a la venta" ("Idaho is not for sale").
    quote:
      text: "The job of a congressman is very clear. It is to represent the voice and interest of your district. It's not your own biases, it's not your party, it's not the donors."
      translation_es: El trabajo de un congresista es muy claro. Es representar la voz y los intereses de su distrito. No son sus propios prejuicios, no es su partido, no son los donantes.
      date: "2026-05-23"
      context: "Interview with East Idaho News about her campaign (the article places \"Gilbreath said\" after the first sentence)."
      source:
        name: "East Idaho News: 'Idaho is not for sale': Why Democrat Ellie Gilbreath thinks it's time for change in the state's 2nd Congressional District"
        url: "https://www.eastidahonews.com/2026/05/idaho-is-not-for-sale-why-democrat-ellie-gilbreath-thinks-its-time-for-change-in-the-states-2nd-congressional-district/"
        date: "2026-05-23"
      verified: true
  - name: "Will Johanson"
    party: L
    bio:
      en: "Boise semiconductor engineer and former Navy nuclear operator."
      es: Ingeniero de semiconductores de Boise y exoperador nuclear de la Marina.
    website: "https://www.johansonforidaho.com/"
    quote:
      text: "give voters an alternative."
      translation_es: darles a los votantes una alternativa.
      date: "2026-09-15"
      context: "Partial quote in an Idaho Capital Sun story (reprinted by KMVT) on why he is running. He also said Simpson seems \"out of touch with our concerns over affordability and the endless wars that we're fighting around the world.\""
      source:
        name: "KMVT (Idaho Capital Sun): Idaho District 2 congressional candidates say they're worried about high cost of living"
        url: "https://www.kmvt.com/2026/09/16/idaho-district-2-congressional-candidates-say-theyre-worried-about-high-cost-living/"
        date: "2026-09-16"
      verified: true
  - name: "Emre Houser"
    party: I
    bio:
      en: "Air Force and Idaho National Guard veteran (27-plus years, including Iraq in 2003) and Idaho business owner, according to his campaign site."
      es: Veterano de la Fuerza Aérea y de la Guardia Nacional de Idaho (más de 27 años, incluso en Irak en 2003) y dueño de un negocio en Idaho, según su sitio de campaña.
    website: "https://www.houserforidaho.com/"
    quote:
      text: "For People, not Powerful Interests"
      translation_es: Por la gente, no por los intereses poderosos
      date: "2026-09-24"
      context: "Campaign slogan on his website (the page is undated; the date is when it was read). No first-person quote was found."
      source:
        name: "Emre Houser campaign website"
        url: "https://www.houserforidaho.com/"
      verified: true
  - name: "Tripp Charles Hutchinson"
    party: I
    bio:
      en: "Ketchum City Council member, elected in 2023."
      es: Miembro del Concejo Municipal de Ketchum, elegido en 2023.
    website: "https://votefortripp.com/"
    quote:
      text: "Every Idaho family should be able to live a normal, fulfilled and decent life on one household income."
      translation_es: Toda familia de Idaho debería poder tener una vida normal, plena y digna con el ingreso de una sola persona en el hogar.
      date: "2026-09-24"
      context: "\"Where I Stand\" section of his campaign website (the page is undated; the date is when it was read)."
      source:
        name: "Tripp Hutchinson campaign website"
        url: "https://votefortripp.com/"
      verified: true
