pick:
  label: two-way
  candidate: Kirsten Faith Richardson
  rule: '3'
  reasoning:
    en: Kirsten Faith Richardson is the only non-Republican on the ballot, so this is a two-way race and turnout is what matters. Under the published method the only non-Republican is the pick, even though she is a Constitution Party candidate.
    es: Kirsten Faith Richardson es la única opción no republicana en la boleta, así que es una contienda entre dos y lo que importa es la participación. Según el método publicado, la única opción no republicana es la recomendación, aunque ella es candidata del Partido de la Constitución.
  approved: false
review_flags:
- The only non-Republican is a Constitution Party candidate. Constitution Party platforms are generally to the right of the Republican Party, so the rule-3 pick may not fit the site's purpose. A human should decide whether a written rule-5 exception (no-pick) applies.
