pick:
  label: no-pick
  candidate: null
  rule: none (rule 5 exception)
  approved: true
  reasoning:
    en: 'There''s no candidate to team up behind here. The Democrat withdrew in March, and the only other name on the ballot runs to the right of the incumbent: Richardson would establish legal "personhood at fertilization," wants to legislate against birth control pills, and her party calls energy "not a proper function of government." Grow is a mainstream Republican who voted for H0911, the law making data centers pay their own power costs, but also for the 2023 "abortion trafficking" bill and the 2025 private-school tax credit. If you vote in this race, compare their records below.'
    es: 'Aquí no hay una candidatura alrededor de la cual unirse. El demócrata se retiró en marzo, y el único otro nombre en la boleta está a la derecha del titular: Richardson establecería la "personalidad jurídica desde la fecundación", quiere legislar contra las pastillas anticonceptivas y su partido dice que la energía "no es una función propia del gobierno". Grow es un republicano tradicional que votó a favor de H0911, la ley que obliga a los centros de datos a pagar su propio costo de electricidad, pero también a favor de la ley de "tráfico de aborto" de 2023 y del crédito fiscal para escuelas privadas de 2025. Si vota en esta contienda, compare sus historiales abajo.'
