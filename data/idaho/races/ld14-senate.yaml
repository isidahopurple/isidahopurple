candidates:
- name: C. Scott Grow
  party: R
  incumbent: true
  bio:
    en: Retired CPA from Eagle, former West Ada school board chair. In the Senate since 2018; chairs Senate Finance and co-chairs the budget committee (JFAC).
    es: Contador público jubilado de Eagle y expresidente de la junta escolar de West Ada. En el Senado desde 2018; preside el Comité de Finanzas del Senado y copreside el comité de presupuesto (JFAC).
  website: https://cscottgrowforidaho.com/
  quote:
    text: When the economy is one of the top economies in the nation, that is not the time to be digging into our reserves.
    translation_es: Cuando la economía es una de las mejores del país, no es momento de echar mano de nuestras reservas.
    date: '2026-03-02'
    context: On using Idaho’s rainy-day funds to avoid budget cuts
    source:
      name: Idaho Education News
      url: https://www.idahoednews.org/news/idaho-has-1-3-billion-in-rainy-day-funds-should-that-money-help-public-schools/
      date: '2026-03-02'
    verified: true
- name: Kirsten Faith Richardson
  party: C
  incumbent: false
  bio:
    en: Farmer from Letha in Gem County. A Constitution Party candidate 13 times since 2006; she got 15.1% against Grow in 2024.
    es: Agricultora de Letha, en el condado de Gem. Candidata del Partido de la Constitución 13 veces desde 2006; obtuvo el 15.1% contra Grow en 2024.
  quote:
    text: to make people accountable for hearing the truth, to stand for the sanctity of life, to limit government to the written Constitution, and to bring Godly morals and culture to Idaho.
    translation_es: para que la gente rinda cuentas por escuchar la verdad, defender la santidad de la vida, limitar el gobierno a la Constitución escrita y traer moral y cultura piadosas a Idaho.
