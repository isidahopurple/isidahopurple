controls: "The Treasurer is the state's banker: the office receives and invests state money, issues short-term tax anticipation notes, and runs unclaimed property, the IDeal 529 college savings plan, the Idaho Bond Bank and the school bond guaranty program. It does not set tax rates or write the budget."
