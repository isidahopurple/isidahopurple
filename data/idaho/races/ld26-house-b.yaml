order: 180
depth: full
controls:
  en: The Idaho Legislature has 35 senators and 70 representatives, each elected for two-year terms; it levies taxes, appropriates public funds and oversees state agencies, and each district elects one senator and two representatives.
  es: La Legislatura de Idaho tiene 35 senadores y 70 representantes, y cada uno se elige por un periodo de dos años. La Legislatura fija los impuestos, asigna los fondos públicos y supervisa las agencias estatales. Cada distrito elige a un senador y a dos representantes.
controls_source:
  name: Idaho Legislature, Idaho's Citizen Legislature
  url: https://legislature.idaho.gov/resources/citizenlegislature/
candidates:
- name: Lyle Johnstone
  party: R
  incumbent: false
  bio:
    en: His campaign site says he served on the Northside Soil and Water Conservation District board.
    es: Su sitio de campaña dice que fue miembro de la junta del Northside Soil and Water Conservation District (distrito de conservación de suelo y agua).
  website: https://www.johnstoneforhouse.com/
  quote:
    text: I am running for the Idaho House to ensure government focuses on practical solutions that protect Idaho's future while preserving the values that make our state a great place to live, work, and raise a family.
    translation_es: Me postulo para la Cámara de Representantes de Idaho para asegurar que el gobierno se enfoque en soluciones prácticas que protejan el futuro de Idaho y que conserven los valores que hacen de nuestro estado un gran lugar para vivir, trabajar y criar una familia.
    date: '2026-09-24'
    context: Campaign homepage (undated page, read 2026-09-24).
    source:
      name: Johnstone for House campaign site
      url: https://www.johnstoneforhouse.com/
    verified: true
- name: Kevin Marsh
  party: D
  incumbent: false
  website: https://www.kevinmarshforidaho.com/
  quote:
    text: Citizens of Blaine, Jerome, and Lincoln counties should vote for me, because I put the interests of their communities first. I will protect water supplies in our district and prioritize local control in government and schools.
    translation_es: Los ciudadanos de los condados de Blaine, Jerome y Lincoln deben votar por mí porque pongo primero los intereses de sus comunidades. Voy a proteger el agua de nuestro distrito y dar prioridad al control local en el gobierno y en las escuelas.
    date: '2026-08-24'
    context: His answer to why people should vote for him, in a TV-station candidate survey.
    source:
      name: Idaho News (CBS2/FOX9), 2026 general election candidate survey
      url: https://idahonews.com/politics/know-your-candidates/2026-general-election-survey-state-representative-district-26b
      date: '2026-08-24'
    verified: true
