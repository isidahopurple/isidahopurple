    url: https://adacounty.id.gov/clerk/wp-content/uploads/sites/9/2023/01/01-Ada-County-Results-Election-Night-November-2022.pdf
pick:
  label: two-way
  candidate: Erik Olson
  rule: '3'
  reasoning:
    en: 'Erik Olson is the only non-Republican on the ballot, so this is a two-way race and turnout is what matters. Be realistic: Arnold won this office by about 17 points in 2022.'
    es: 'Erik Olson es la única opción no republicana en la boleta, así que es una contienda entre dos y lo que importa es la participación. Seamos realistas: Arnold ganó este cargo por unos 17 puntos en 2022.'
  approved: true
review_flags: []
unverified:
- Both quotes are from undated campaign homepages; the date shown is when they were read.
- No independent background on Erik Olson was found; his bio is based on his campaign's stated goals. (He is not the 2022 Democratic nominee, Erik Steven Berg.)
- Arnold's ACHD years (2005 to 2021) come from Ballotpedia; her attorney and former CPA background comes from her campaign website.
