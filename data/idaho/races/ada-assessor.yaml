office:
  en: Ada County Assessor
  es: Tasador del Condado de Ada
level: county
district: Ada
order: 303
depth: full
controls:
  en: The Assessor sets the taxable value of property in Ada County, runs property tax relief programs such as the homeowner's exemption and the property tax reduction program, and handles vehicle registrations and titles (DMV). The Assessor does not set tax rates; those are set by the county, cities, schools and other taxing districts.
  es: El tasador fija el valor gravable de las propiedades en el Condado de Ada, maneja los programas de alivio del impuesto a la propiedad, como la exención para dueños de vivienda y el programa de reducción del impuesto a la propiedad, y se encarga de los registros y títulos de vehículos (DMV). El tasador no fija las tasas de impuestos; esas las fijan el condado, las ciudades, las escuelas y otros distritos.
controls_source:
  name: Ada County Assessor's Office
  url: https://adacounty.id.gov/assessor/
candidates:
- name: Rebecca W. Arnold
  party: R
  incumbent: true
  bio:
    en: Ada County Assessor since January 2023; attorney and former CPA who served on the Ada County Highway District commission from 2005 to 2021.
    es: Tasadora del Condado de Ada desde enero de 2023; abogada y excontadora pública que formó parte de la comisión del Distrito de Carreteras del Condado de Ada (ACHD) de 2005 a 2021.
  website: https://arnoldforidaho.com/
  quote:
    text: We can deliver fair and equitable assessments and provide excellent service to our community. Both. That’s the standard.
    translation_es: Podemos hacer avalúos justos y equitativos y dar un servicio excelente a nuestra comunidad. Las dos cosas. Ese es el estándar.
    date: '2026-09-26'
    context: Pull quote on her re-election campaign website (the page is undated; the date is when it was read).
    source:
      name: Re-Elect Rebecca Arnold (campaign website)
      url: https://arnoldforidaho.com/
    verified: true
- name: Erik Olson
  party: D
  incumbent: false
  bio:
    en: Running on modernizing the Assessor's Office, adding digital services and helping homeowners get every property tax exemption they qualify for.
    es: Hace campaña para modernizar la Oficina del Tasador, ofrecer más servicios en línea y ayudar a los dueños de vivienda a recibir todas las exenciones del impuesto a la propiedad que les corresponden.
  website: https://erikforidaho.com/
  quote:
    text: My first promise to every voter is to provide a different type of campaign, free from mudslinging and muckraking, and focused on the changes I intend to bring to this office! I don't believe the current incumbent is a bad person, I simply believe I can do better for Ada County.
    translation_es: ¡Mi primera promesa a cada votante es hacer un tipo de campaña diferente, sin ataques ni escándalos, y enfocada en los cambios que pienso traer a esta oficina! No creo que la titular actual sea una mala persona; simplemente creo que yo puedo hacerlo mejor por el Condado de Ada.
    date: '2026-09-26'
    context: Introduction on the home page of his campaign website (the page is undated; the date is when it was read).
    source:
      name: Erik for Idaho (campaign website)
      url: https://erikforidaho.com/
    verified: true
history:
- year: 2022
  label: 2022 Ada County Assessor
  result: Arnold (R) 58.7, Berg (D) 41.3
  margin: R+17.4
  source:
