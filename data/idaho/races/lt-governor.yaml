office:
  en: "Lieutenant Governor"
  es: Vicegobernador
level: statewide
order: 10
depth: full
controls:
  en: "The Lieutenant Governor presides over the Idaho Senate and votes only to break a tie. When the governor is out of state, unable to serve or the office is vacant, the Lieutenant Governor acts as governor."
  es: El vicegobernador preside el Senado de Idaho y solo vota para romper un empate. Cuando el gobernador está fuera del estado, no puede ejercer el cargo o el puesto está vacante, el vicegobernador actúa como gobernador.
controls_source:
  name: "Idaho Constitution, Article IV, Sections 12 and 13"
  url: "https://legislature.idaho.gov/statutesrules/idconst/ArtIV/Sect13/"
candidates:
  - name: "Scott Bedke"
    party: R
    incumbent: true
    bio:
      en: "Lieutenant Governor since 2023; cattle rancher from Oakley and former Speaker of the Idaho House."
      es: Vicegobernador desde 2023; ganadero de Oakley y expresidente de la Cámara de Representantes de Idaho.
    website: "https://bedkeforidaho.com/"
    quote:
      text: "Over the last three years as your Lt. Governor, I've worked every day to protect our Idaho way of life and our state's future. I've never forgotten that I work for my fellow Idahoans, and that means defending our freedoms and our borders, limiting government interference, and delivering meaningful tax relief."
      translation_es: Durante los últimos tres años como su vicegobernador, he trabajado todos los días para proteger nuestra forma de vida en Idaho y el futuro de nuestro estado. Nunca he olvidado que trabajo para mis compañeros de Idaho, y eso significa defender nuestras libertades y nuestras fronteras, limitar la intervención del gobierno y lograr una verdadera reducción de impuestos.
      date: "2025-09-08"
      context: "Statement announcing his 2026 re-election campaign, as reported by KMVT."
      source:
        name: "KMVT: Lt. Gov. Scott Bedke announces re-election campaign"
        url: "https://www.kmvt.com/2025/09/09/lt-gov-scott-bedke-announces-re-election-campaign-2026/"
        date: "2025-09-08"
      verified: true
  - name: "Eric Myricks"
    party: D
    bio:
      en: "Treasure Valley entrepreneur and nonprofit founder; former youth pastor."
      es: Empresario del Treasure Valley y fundador de una organización sin fines de lucro; fue pastor de jóvenes.
    website: "https://ericforidaho.com/"
    quote:
      text: "Like Andrus, Eric is a moderate Democrat who believes government works best when it listens, includes, and solves problems for everyone, not just the well-connected few."
      translation_es: Igual que Andrus, Eric es un demócrata moderado que cree que el gobierno funciona mejor cuando escucha, incluye a todos y resuelve problemas para todos, no solo para unos pocos con buenas conexiones.
      date: "2026-09-24"
      context: "Campaign homepage copy, written in the third person (the page is undated; the date is when it was read)."
      source:
        name: "Eric Myricks campaign website"
        url: "https://ericforidaho.com/"
      verified: true
