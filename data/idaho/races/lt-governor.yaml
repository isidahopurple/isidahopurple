unverified:
  - "Myricks's quote is third-person campaign copy, not words he is recorded saying. No dated first-person 2026 quote was found. His 2025 Nampa mayoral run is reported by candidate directories but was not confirmed by a newsroom source, so it is not in his bio."
  - "The Myricks page was read through a fetch tool because direct access was blocked. Worth a human re-check."
